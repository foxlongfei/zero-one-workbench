name: Watch World live source refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths:
      - 'scripts/watch-world/**'
      - '.github/workflows/watch-world-quality.yml'
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Discover and verify 720p streams
        run: python3 scripts/watch-world/discover.py
      - name: Validate and deduplicate
        run: node scripts/watch-world/check-sources.mjs
      - name: Upload verified directory for inspection
        uses: actions/upload-artifact@v4
        with:
          name: watch-world-verified-catalog
          path: portal/watch-world-sources.json
          retention-days: 14
      - name: Commit verified catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add portal/watch-world-sources.json
          git diff --cached --quiet || (git commit -m "data(watch-world): refresh verified live streams" && git push)

name: Verify public Human Atlas WebGL

on:
  push:
    paths:
      - ".github/workflows/verify-public-anatomy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-public-human-atlas
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser verifier
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0 pngjs@7.0.0 pixelmatch@7.1.0
          npx playwright install chromium --with-deps

      - name: Verify public main entry with software WebGL
        env:
          PUBLIC_URL: https://foxlongfei.github.io/zero-one-workbench/portal/movement.html
          EVIDENCE_DIR: docs/v0.1/evidence/m2
        run: node scripts/verify-public-anatomy.cjs

      - name: Upload immutable verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-public-webgl-evidence
          path: docs/v0.1/evidence/m2/
          if-no-files-found: error

      - name: Commit passing evidence
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v0.1/evidence/m2/
          git commit -m "test(anatomy): record public WebGL rotation and zoom evidence"
          git pull --rebase origin main
          git push origin HEAD:main

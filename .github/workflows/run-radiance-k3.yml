name: Run Radiance K3 daylight analysis

on:
  push:
    paths:
      - ".github/workflows/run-radiance-k3.yml"
      - "scripts/run-radiance-k3.py"
      - "models/k3-radiance/guangzhou-room.rad"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: run-radiance-k3
  cancel-in-progress: false

jobs:
  radiance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned official Radiance 6.0.2 Linux binaries
        run: |
          curl -fsSL "https://github.com/LBNL-ETA/Radiance/releases/download/rad6R0P2/Radiance_c1700d56_Linux.zip" -o /tmp/radiance.zip
          echo "04ee53cafbb64b943a53616b3d0ee379dd7ef80379c83aa7a145e547d9809c28  /tmp/radiance.zip" | sha256sum --check
          unzip -q /tmp/radiance.zip -d /tmp/radiance
          unzip -Z1 /tmp/radiance.zip | sed -n '1,120p'
          RTRACE_PATH="$(find /tmp/radiance -type f -name rtrace -print -quit)"
          test -n "$RTRACE_PATH"
          RAD_BIN="$(dirname "$RTRACE_PATH")"
          chmod +x "$RAD_BIN"/*
          git clone --depth 1 --branch rad6R0P2 https://github.com/LBNL-ETA/Radiance.git /tmp/radiance-source
          RAD_LIB="/tmp/radiance-source/lib"
          test -x "$RAD_BIN/rtrace"
          test -f "$RAD_LIB/rayinit.cal"
          echo "$RAD_BIN" >> "$GITHUB_PATH"
          echo "RAYPATH=.:$RAD_LIB" >> "$GITHUB_ENV"

      - name: Confirm mature Radiance binaries
        run: |
          which gensky
          which oconv
          which rtrace
          rtrace -version

      - name: Execute real gensky to oconv to rtrace chain
        run: |
          python scripts/run-radiance-k3.py             --model models/k3-radiance/guangzhou-room.rad             --output-json portal/data/k3-radiance-daylight.json             --output-csv portal/data/k3-radiance-daylight.csv             --evidence-json docs/v0.1/evidence/k3/radiance-engine-run.json

      - name: Validate engine artifacts
        run: |
          python - <<'PY'
          import json
          data = json.load(open("portal/data/k3-radiance-daylight.json"))
          assert data["passed"] is True
          assert data["engine"]["name"] == "Radiance"
          assert data["analysis"]["sensorCount"] == 20
          assert data["analysis"]["unit"] == "lux"
          assert data["checks"]["radianceBinariesExecuted"] is True
          assert data["checks"]["sceneCompiledByOconv"] is True
          assert data["checks"]["nearWindowMeanExceedsDeepZoneMean"] is True
          print("RADIANCE_K3_ENGINE_PASS", data["analysis"]["summary"])
          PY

      - name: Upload immutable engine artifacts
        uses: actions/upload-artifact@v4
        with:
          name: k3-radiance-engine-artifacts
          path: |
            portal/data/k3-radiance-daylight.json
            portal/data/k3-radiance-daylight.csv
            docs/v0.1/evidence/k3/radiance-engine-run.json
          if-no-files-found: error

      - name: Commit reproducible calculation products
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portal/data/k3-radiance-daylight.json portal/data/k3-radiance-daylight.csv docs/v0.1/evidence/k3/radiance-engine-run.json
          git commit -m "data(k3): record real Radiance daylight results"
          git pull --rebase origin main
          git push origin HEAD:main

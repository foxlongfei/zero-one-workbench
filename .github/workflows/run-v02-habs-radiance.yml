name: V0.2 HABS same-case Radiance

on:
  push:
    branches: [agent/a01-pilot-38018904993]
    paths:
      - "scripts/run-habs-radiance.py"
      - "research/depthmap/habs-dc-97-first-floor-trace.json"
      - "models/v02-habs-dc-97/habs-dc-97-first-floor.rad"
      - ".github/workflows/run-v02-habs-radiance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v02-habs-radiance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  radiance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned official Radiance 6.0.2 Linux binaries
        run: |
          curl -fsSL "https://github.com/LBNL-ETA/Radiance/releases/download/rad6R0P2/Radiance_c1700d56_Linux.zip" -o /tmp/radiance.zip
          echo "04ee53cafbb64b943a53616b3d0ee379dd7ef80379c83aa7a145e547d9809c28  /tmp/radiance.zip" | sha256sum --check
          unzip -q /tmp/radiance.zip -d /tmp/radiance-outer
          mkdir -p /tmp/radiance-install
          tar --no-same-owner -xzf "$(find /tmp/radiance-outer -type f -name '*.tar.gz' -print -quit)" -C /tmp/radiance-install
          RAD_ROOT="$(find /tmp/radiance-install -type f -name rtrace -path '*/radiance/bin/*' -printf '%h/..\n' -quit)"
          test -n "$RAD_ROOT"
          echo "$RAD_ROOT/bin" >> "$GITHUB_PATH"
          echo "RAYPATH=.:$RAD_ROOT/lib" >> "$GITHUB_ENV"
      - name: Reproduce same-case daylight calculation
        run: |
          python scripts/run-habs-radiance.py \
            --trace research/depthmap/habs-dc-97-first-floor-trace.json \
            --model models/v02-habs-dc-97/habs-dc-97-first-floor.rad \
            --output-json /tmp/habs-radiance.json \
            --output-csv /tmp/habs-radiance.csv \
            --evidence-json /tmp/habs-evidence.json
          python - <<'PY'
          import json
          expected=json.load(open('portal/data/v02-habs-dc-97-radiance-daylight.json'))
          actual=json.load(open('/tmp/habs-radiance.json'))
          assert actual['passed'] is True
          assert actual['caseId'] == expected['caseId']
          assert actual['engine']['release'] == 'rad6R0P2'
          assert actual['model']['sha256'] == expected['model']['sha256']
          assert actual['analysis']['sensorCount'] == expected['analysis']['sensorCount'] == 80
          expected_mean=expected['analysis']['summary']['meanLux']
          actual_mean=actual['analysis']['summary']['meanLux']
          assert abs(actual_mean-expected_mean)/expected_mean < 0.10
          assert actual['analysis']['summary']['minimumLux'] > 0
          print('HABS_RADIANCE_REPRODUCED', actual['analysis']['summary'])
          PY
      - name: Upload reproducibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: v02-habs-radiance-${{ github.sha }}
          path: |
            /tmp/habs-radiance.json
            /tmp/habs-radiance.csv
            /tmp/habs-evidence.json
            models/v02-habs-dc-97/habs-dc-97-first-floor.rad
          if-no-files-found: error

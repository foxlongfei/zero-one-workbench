name: Verify public K5 advisor closure

on:
  push:
    paths:
      - ".github/workflows/verify-public-k5.yml"
      - "scripts/verify-public-k5.cjs"
      - "portal/k02-board.html"
      - "portal/assets/k5-advisor-v0.1.js"
      - "portal/data/k5-advisor-case.json"
      - "docs/v0.1/K5-completion-report-2026-10-08.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-public-k5
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser verifier
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium --with-deps
      - name: Verify deployed K5 advisor artifact and full interaction
        env:
          PUBLIC_URL: https://foxlongfei.github.io/zero-one-workbench/portal/k02-board.html
          EVIDENCE_DIR: docs/v0.1/evidence/k5
        run: node scripts/verify-public-k5.cjs
      - name: Upload immutable public evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k5-public-advisor-evidence
          path: docs/v0.1/evidence/k5/
          if-no-files-found: error
      - name: Commit passing public evidence
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v0.1/evidence/k5/
          if git diff --cached --quiet; then
            echo "Public evidence already matches the verified deployment; no commit required."
            exit 0
          fi
          git commit -m "test(k5): record public advisor verification"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Unable to push K5 evidence after 3 attempts." >&2
          exit 1

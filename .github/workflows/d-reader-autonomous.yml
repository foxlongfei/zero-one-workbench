name: D博士 C01 autonomous prototype delivery
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d-reader-autonomous.yml'
  schedule:
    - cron: '23 3 * * *'
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  deepseek-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ask D博士 to own implementation and write files
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,urllib.request,subprocess
          key=os.environ.get('DEEPSEEK_API_KEY')
          if not key: raise SystemExit('Missing DEEPSEEK_API_KEY')
          paths=['handoffs/C01-DEEPSEEK-OWNER.md','portal/reader-integrated.html','portal/reader-integrated.js','tests/c01-reader/check.mjs']
          sources=[]
          for p in paths:
            f=pathlib.Path(p)
            if f.exists(): sources.append({'path':p,'content':f.read_text(encoding='utf-8')[:18000]})
          issue=subprocess.run(['gh','issue','view','42','--json','body,comments'],capture_output=True,text=True,check=True)
          context={'sources':sources,'issue42':json.loads(issue.stdout)}
          system='''你是D博士，C01陪你读书产品唯一技术决策和实现负责人。你有权自主选择或推翻开源栈，必须交付可实际使用的原型并持续自动更新。用户原始功能目标不能被裁剪。请从当前仓库真实代码中选择本轮一个可验证、可落地的产品增量，不要只给建议。输出严格JSON对象 {"decision":"技术路线/选型依据及许可风险","files":[{"path":"portal/reader-integrated.js","content":"完整替换后的文件内容"}],"test_commands":["node tests/c01-reader/check.mjs"],"limitations":"..."}。files可以包括 portal/ 内新文件或 tests/c01-reader/ 文件；尽量做最小安全增量，保留原功能。不要声称未执行的测试已通过。若需要完整重构可自行做，但单次输出大小有限，分多轮。不得修改工作流、密钥、仓库配置。'''
          req=urllib.request.Request('https://api.deepseek.com/chat/completions',data=json.dumps({'model':'deepseek-chat','messages':[{'role':'system','content':system},{'role':'user','content':json.dumps(context,ensure_ascii=False)}],'response_format':{'type':'json_object'},'max_tokens':8192,'stream':False}).encode(),headers={'Authorization':'Bearer '+key,'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=180) as response: result=json.load(response)
          answer=json.loads(result['choices'][0]['message']['content'])
          pathlib.Path('artifacts/d-reader').mkdir(parents=True,exist_ok=True)
          pathlib.Path('artifacts/d-reader/decision.json').write_text(json.dumps({k:v for k,v in answer.items() if k!='files'},ensure_ascii=False,indent=2))
          changed=[]
          for item in answer.get('files',[]):
            p=item.get('path','')
            if not (p.startswith('portal/') or p.startswith('tests/c01-reader/')) or '..' in pathlib.PurePosixPath(p).parts: raise ValueError('Unsafe path: '+p)
            if not p.endswith(('.js','.mjs','.html','.css','.json')): raise ValueError('Unsupported file extension: '+p)
            f=pathlib.Path(p); f.parent.mkdir(parents=True,exist_ok=True); f.write_text(item['content'],encoding='utf-8');changed.append(p)
          if not changed: raise SystemExit('D博士 returned no implementation files')
          print('D博士自主决定:',answer.get('decision',''))
          print('Changed:',changed)
          PY
      - name: Run existing C01 tests
        run: |
          node tests/c01-reader/check.mjs
      - name: Create D博士 delivery pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "D博士 automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="d-reader/auto-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git add portal/ tests/c01-reader/
          git diff --cached --quiet && { echo "No code changes"; exit 1; }
          git commit -m "D博士: C01 reader prototype implementation ${GITHUB_RUN_ID}"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "D博士 C01 原型增量 #${GITHUB_RUN_ID}" --body "D博士自主生成代码，已通过仓库现有C01测试。技术选择与局限记录在本次Actions产物。待合并后由GitHub Pages自动发布；不代表最终用户验收。关联 #42。"
          gh issue comment 42 --body "D博士已生成真实代码并运行C01测试，提交自动PR供交付检查。运行证据：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}。最终交付仍需合并、部署与实际验收。"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d-reader-implementation-${{ github.run_id }}
          path: artifacts/d-reader/
          retention-days: 30

name: D博士 C01 autonomous prototype delivery
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d-reader-autonomous.yml'
  schedule:
    - cron: '23 3 * * *'
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  deepseek-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Ask D博士 to own implementation and write files
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/d-reader
          python3 - <<'PY'
          import json,os,pathlib,urllib.request,urllib.error,subprocess,time,traceback
          out=pathlib.Path('artifacts/d-reader');out.mkdir(parents=True,exist_ok=True)
          key=os.environ.get('DEEPSEEK_API_KEY')
          if not key: raise SystemExit('Missing DEEPSEEK_API_KEY')
          paths=['handoffs/C01-DEEPSEEK-OWNER.md','portal/reader-integrated.html','portal/reader-integrated.js','tests/c01-reader/check.mjs']
          sources=[]
          for p in paths:
           f=pathlib.Path(p)
           if f.exists(): sources.append({'path':p,'content':f.read_text(encoding='utf-8')[:12000]})
          issue=subprocess.run(['gh','issue','view','42','--json','body,comments'],capture_output=True,text=True,check=True)
          context={'sources':sources,'issue42':json.loads(issue.stdout)}
          system='''你是D博士，C01陪你读书的唯一技术选型和产品实现负责人。你可自主推翻原技术架构和选用任何许可允许的成熟开源实现；现有文件只是参考。每次只提交一个小而有效的修复或功能模块。为防模型输出截断，禁止返回整个超长文件，优先新建一个独立的短模块，或对现有文件提供少量精确文本替换。仅返回严格JSON，结构为 {"decision":"技术选择与依据","edits":[{"path":"portal/reader-integrated.js","find":"要精确匹配的一小段现有文本","replace":"替换文本"}],"new_files":[{"path":"portal/new-module.js","content":"文件内容"}],"limitations":"..."}。单次输出不超过约10000字符，替换find必须存在并且只出现一次；新建文件必须不存在。不得修改密钥、工作流或CI，禁止任何未经用户授权的语音克隆。请用真实可运行代码交付而不是空建议。'''
          answer=None
          for attempt in range(1,5):
           try:
            extra='前一次输出不完整或不可解析，请只输出更小的单个可执行改动，控制在6000字符内。' if attempt>1 else ''
            data=json.dumps({'model':'deepseek-chat','messages':[{'role':'system','content':system},{'role':'user','content':json.dumps(context,ensure_ascii=False)+'\n'+extra}],'response_format':{'type':'json_object'},'max_tokens':8192,'stream':False}).encode()
            request=urllib.request.Request('https://api.deepseek.com/chat/completions',data=data,headers={'Authorization':'Bearer '+key,'Content-Type':'application/json'})
            with urllib.request.urlopen(request,timeout=180) as response: result=json.load(response)
            message=result['choices'][0]['message']
            raw=message.get('content') or ''
            (out/('attempt-'+str(attempt)+'.json')).write_text(json.dumps({'answer':raw,'finish_reason':result['choices'][0].get('finish_reason'),'usage':result.get('usage',{})},ensure_ascii=False,indent=2),encoding='utf-8')
            if result['choices'][0].get('finish_reason')=='length':raise ValueError('Model truncated response')
            answer=json.loads(raw)
            if not isinstance(answer.get('edits',[]),list) or not isinstance(answer.get('new_files',[]),list):raise ValueError('Invalid edits/new_files')
            break
           except Exception as e:
            (out/('error-'+str(attempt)+'.txt')).write_text(str(e),encoding='utf-8')
            print('Attempt',attempt,'failed:',str(e))
            if attempt==4:raise
            time.sleep(attempt*2)
          changed=[]
          def checkpath(p):
           path=pathlib.PurePosixPath(p)
           if path.is_absolute() or '..' in path.parts or not (p.startswith('portal/') or p.startswith('tests/c01-reader/')):raise ValueError('Unsafe path: '+p)
           if not p.endswith(('.js','.mjs','.html','.css','.json')):raise ValueError('Unsupported extension: '+p)
           return pathlib.Path(p)
          for item in answer.get('edits',[]):
           f=checkpath(item['path']);before=f.read_text(encoding='utf-8')
           needle=item.get('find','')
           if not needle or before.count(needle)!=1:raise ValueError('Non-unique or missing anchor: '+str(f))
           f.write_text(before.replace(needle,item['replace'],1),encoding='utf-8');changed.append(str(f))
          for item in answer.get('new_files',[]):
           f=checkpath(item['path'])
           if f.exists():raise ValueError('Refuse overwrite existing file: '+str(f))
           f.parent.mkdir(parents=True,exist_ok=True);f.write_text(item['content'],encoding='utf-8');changed.append(str(f))
          (out/'decision.json').write_text(json.dumps({'decision':answer.get('decision'),'limitations':answer.get('limitations'),'changed':changed},ensure_ascii=False,indent=2),encoding='utf-8')
          if not changed:raise SystemExit('D博士没有提供可执行改动')
          print('D博士修改文件:',changed)
          
          PY
      - name: Run existing C01 tests
        run: |
          node tests/c01-reader/check.mjs
      - name: Create D博士 delivery pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "D博士 automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="d-reader/auto-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git add portal/ tests/c01-reader/
          git diff --cached --quiet && { echo "No code changes"; exit 1; }
          git commit -m "D博士: C01 reader prototype implementation ${GITHUB_RUN_ID}"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "D博士 C01 原型增量 #${GITHUB_RUN_ID}" --body "D博士自主生成代码，已通过仓库现有C01测试。技术选择与局限记录在本次Actions产物。待合并后由GitHub Pages自动发布；不代表最终用户验收。关联 #42。"
          gh issue comment 42 --body "D博士已生成真实代码并运行C01测试，提交自动PR供交付检查。运行证据：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}。最终交付仍需合并、部署与实际验收。"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d-reader-implementation-${{ github.run_id }}
          path: artifacts/d-reader/
          retention-days: 30

name: Verify public M5 training loop

on:
  push:
    paths:
      - ".github/workflows/verify-public-m5.yml"
      - "portal/movement.html"
      - "portal/assets/m5-training-loop-v0.1.js"
      - "portal/data/m5-training-scenarios.json"
      - "scripts/validate-m5-training-data.mjs"
      - "scripts/verify-public-m5.cjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-public-m5-training-loop
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate training scenarios and safety rules
        run: node scripts/validate-m5-training-data.mjs

      - name: Install browser verifier
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium --with-deps

      - name: Execute public two-scenario feedback loop and safety routing
        env:
          PUBLIC_URL: https://foxlongfei.github.io/zero-one-workbench/portal/movement.html
          EVIDENCE_DIR: docs/v0.1/evidence/m5
        run: node scripts/verify-public-m5.cjs

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-public-training-loop-evidence
          path: docs/v0.1/evidence/m5/
          if-no-files-found: error

      - name: Commit verifier evidence
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v0.1/evidence/m5/
          git commit -m "test(m5): record public training loop evidence"
          git pull --rebase origin main
          git push origin HEAD:main

name: Publish Zero One Workbench Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate published World Reader index
        run: node scripts/world-reader/check-public-index.cjs
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp -a portal _site/portal
          bash scripts/prepare-a01-mediapipe-vendor.sh _site/portal
          printf '%s\n' '<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=portal/"><title>零一空间</title><a href="portal/">进入零一空间</a></html>' > _site/index.html
          test -s _site/portal/classical-radio.html
          test -s _site/portal/index.html
          test -s _site/portal/reading-library.html
          test -s _site/portal/reader-integrated.html
          test -s _site/portal/reader-integrated.js
          test -s _site/portal/vendor/foliate-js/view.js
          test -s _site/portal/vendor/mediapipe/vision_bundle.mjs
          test -s _site/portal/vendor/mediapipe/wasm/vision_wasm_internal.wasm
          test -s _site/portal/vendor/mediapipe/models/pose_landmarker_lite.task
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

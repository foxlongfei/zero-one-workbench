name: Publish Daily World Reader
on:
  push:
    branches: [main]
    paths:
      - 'portal/daily-reading/**'
      - '.github/workflows/daily-reading-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: daily-reading-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage site at stable path
        run: |
          mkdir -p _site/portal/daily-reading
          cp portal/daily-reading/index.html _site/portal/daily-reading/index.html
          printf '%s' '<meta http-equiv="refresh" content="0;url=portal/daily-reading/index.html">' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

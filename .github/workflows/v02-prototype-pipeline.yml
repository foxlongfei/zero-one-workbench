name: V0.2 Three Prototype Delivery Pipeline
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'portal/**'
      - 'tests/v02/**'
      - '.github/workflows/v02-prototype-pipeline.yml'
  pull_request:
    paths:
      - 'portal/**'
      - 'tests/v02/**'
      - '.github/workflows/v02-prototype-pipeline.yml'
  schedule:
    - cron: '17 3 * * *'
  issues:
    types: [opened, edited, reopened]
permissions:
  contents: read
  issues: write
concurrency:
  group: v02-prototype-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prototype-contracts:
    name: ${{ matrix.project }} prototype contracts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: A01
            page: movement-v02-experience.html
            task: '22'
          - project: B01
            page: traditional-case-v02.html
            task: '21'
          - project: C01
            page: read-with-you-v01.html
            task: '10-15'
    steps:
      - uses: actions/checkout@v4
      - name: Static functional contract checks
        run: |
          test -f tests/v02/check_prototypes.py || { echo 'Missing prototype contract checker in this commit'; exit 1; }
          python3 tests/v02/check_prototypes.py --project "${{ matrix.project }}"
      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v02-${{ matrix.project }}-contract
          path: reports/v02/
          if-no-files-found: ignore
  browser-smoke:
    name: Browser journey smoke tests
    runs-on: ubuntu-latest
    needs: prototype-contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright runner and Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test user journeys
        run: |
          node tests/v02/browser-smoke.cjs
          node tests/v02/a01-mediapipe-smoke.cjs
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v02-browser-smoke
          path: reports/v02/
          if-no-files-found: ignore
  public-readback:
    name: Public Pages availability (main only)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: browser-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait and check public entrypoints
        run: python3 tests/v02/check_public.py
      - name: Upload public report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v02-public-readback
          path: reports/v02/
          if-no-files-found: ignore
  failure-feedback:
    name: Write failed pipeline evidence back to quality gate
    if: always() && (needs.prototype-contracts.result == 'failure' || needs.browser-smoke.result == 'failure' || needs.public-readback.result == 'failure')
    needs: [prototype-contracts, browser-smoke, public-readback]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comment with run evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
          CONTRACTS: ${{ needs.prototype-contracts.result }}
          BROWSER: ${{ needs.browser-smoke.result }}
          PUBLIC: ${{ needs.public-readback.result }}
        run: |
          gh issue comment 23 --repo "$REPO" --body "V0.2 automated check failed. Run: https://github.com/$REPO/actions/runs/$RUN . Contract: $CONTRACTS; Browser: $BROWSER; Public: $PUBLIC. Inspect artifacts/screenshots, repair, rerun. This is not an accepted prototype."

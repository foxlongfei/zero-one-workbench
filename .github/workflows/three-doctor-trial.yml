name: Three-doctor bounded discussion trial
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/three-doctor-trial.yml'
permissions:
  contents: read
concurrency:
  group: three-doctor-bounded-trial
  cancel-in-progress: false
jobs:
  independent-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Independent Q and D responses (one request each)
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error,pathlib
          tasks={
            'Q':'原施工单 RW-01 #11：C01整书EPUB/TXT导入、目录章节、跨章节连续TTS、进度恢复。已存在 portal/reading-library.html 与 portal/read-with-you-v01.html 但未集成。请列出最小可执行代码修改（文件、函数、测试、许可风险），不得新增施工单或假称完成。限300字。',
            'D':'原施工单 RW-02 #12：C01真实TTS、背景音独立音量/ducking、经知情同意的家人声音定制。请列出优先复用的可验证实现路径、最小代码修改、许可证/隐私/成本检查及可执行测试。不得新增施工单或假称完成。限300字。'
          }
          models=[
            ('Q','https://ws-6iu14ig5jvyp9gev.cn-beijing.maas.aliyuncs.com/compatible-mode/v1/chat/completions','qwen3.8-flash','DASHSCOPE_API_KEY'),
            ('D','https://api.deepseek.com/chat/completions','deepseek-chat','DEEPSEEK_API_KEY')]
          reports=[]
          pathlib.Path('artifacts/v02').mkdir(parents=True,exist_ok=True)
          output=pathlib.Path('artifacts/v02/three-doctor-trial.json')
          def save():
            output.write_text(json.dumps({'scope':'Existing RW-01 #11 and RW-02 #12 API execution evidence only; NOT product code or acceptance','results':reports},ensure_ascii=False,indent=2),encoding='utf8')
          save()
          for role,url,model,keyname in models:
            task=tasks[role]
            key=os.environ.get(keyname,'')
            if not key: raise SystemExit(role+' secret missing')
            data=json.dumps({'model':model,'messages':[{'role':'user','content':task}],'max_tokens':120,'stream':False}).encode()
            req=urllib.request.Request(url,data=data,headers={'Authorization':'Bearer '+key,'Content-Type':'application/json'},method='POST')
            try:
              with urllib.request.urlopen(req,timeout=45) as response: result=json.load(response)
            except urllib.error.HTTPError as e:
              reports.append({'role':role,'model':model,'status':'HTTP_ERROR','http_status':e.code})
              save()
              print(role,'HTTP failure:',e.code)
              continue
            except Exception as e:
              reports.append({'role':role,'model':model,'status':'REQUEST_FAILED','error_type':type(e).__name__})
              save()
              print(role,'request failed:',type(e).__name__)
              continue
            answer=result['choices'][0]['message'].get('content','')
            reports.append({'role':role,'model':result.get('model',model),'status':'SUCCESS','answer':answer,'usage':result.get('usage',{})})
            save()
            print(role,'returned; tokens:',result.get('usage',{}).get('total_tokens','unknown'))
          print('Recorded model outcomes:',[(r['role'],r['status']) for r in reports])
          if any(r['status']!='SUCCESS' for r in reports): raise SystemExit(1)
          PY
      - name: Upload trial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: three-doctor-trial-${{ github.run_id }}
          path: artifacts/v02/three-doctor-trial.json
          retention-days: 7

name: D博士 V0.3 独立原型交付
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d-reader-v03-delivery.yml'
permissions:
  contents: write
  pull-requests: write
  issues: write
concurrency:
  group: d-reader-v03-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  develop:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gather latest user instructions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/reader-v03
          gh issue view 42 --json title,body,comments > /tmp/reader-v03/issue-42.json
          git ls-files > /tmp/reader-v03/files.txt
      - name: D博士自主开发V0.3原型
        uses: QwenLM/qwen-code-action@v1
        with:
          openai_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
          openai_base_url: https://api.deepseek.com/v1
          openai_model: deepseek-chat
          prompt: |
            You are D博士 (DeepSeek), independent product owner for 陪你读书 V0.3.
            Read /tmp/reader-v03/issue-42.json, especially the newest user instructions.
            Only V0.3 is active. Older C01/V0.1/V0.2 implementations and PRs are historical optional references, not tasks to continue.
            The user authorizes immediate implementation without a plan-only waiting gate.
            Independently select architecture, legal open-source components, ebook reading, TTS, and consent-based voice features.
            The user suggests static frontend plus cloud APIs; evaluate it yourself. Do not expose API keys or claim untested cloud endpoints work.
            Deliver an actual user-operable V0.3 prototype in this repository, with functional reading and audio paths, meaningful product code,
            honest feature limitations, tests you choose, and a viable Pages publishing path.
            Do not stop at planning, documentation, logs, or an audit. If a dependency fails, repair or replace it.
            You may choose or replace any application architecture. Do not change .github workflows, secrets, permissions,
            branch protections, or auto-merge; do not include copyrighted book or voice samples without permission.
            Keep any voice cloning opt-in with explicit speaker consent. Do not claim deployment unless verified.
      - name: Check actual product increment
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --porcelain --untracked-files=all > /tmp/reader-v03/changes.txt
          test -s /tmp/reader-v03/changes.txt || { echo 'BLOCKED: no repository changes'; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/reader-v03/changes.txt').read_text().splitlines()
          paths=[line[3:] for line in lines]
          if any(p.startswith('.github/') or p.split('/')[-1].startswith('.env') for p in paths):
              raise SystemExit('BLOCKED: security-sensitive changes')
          if not any(not p.startswith(('docs/','artifacts/','.qwen/')) for p in paths):
              raise SystemExit('BLOCKED: no application code changes')
          print('Changed product files:', paths)
          PY
      - name: Publish unique V0.3 draft PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "D博士 V0.3 automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="d-reader/v03-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$BRANCH"
          git add -A ':!.github'
          git diff --cached --quiet && exit 1
          git commit -m "D博士 V0.3 prototype increment ${GITHUB_RUN_ID}"
          git push --set-upstream origin "$BRANCH"
          URL=$(gh pr create --draft --base main --head "$BRANCH" --title "D博士｜陪你读书 V0.3 原型 #${GITHUB_RUN_ID}" --body "Independent D博士 V0.3 product work. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Not automatically merged or published.")
          SHA=$(git rev-parse HEAD)
          gh issue comment 42 --body "V0.3 execution produced draft PR: $URL; SHA: $SHA; run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Product deployment still requires verification."

name: C01 real book browser integration
on:
  pull_request:
    branches: [main]
    paths:
      - 'portal/read-with-you-v01.html'
      - 'portal/reader-integrated.js'
      - 'portal/vendor/foliate-js/**'
      - 'tests/c01-reader/**'
      - '.github/workflows/c01-reader-integration.yml'
  workflow_dispatch:
jobs:
  real-books:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate product and browser test syntax
        run: node --check portal/reader-integrated.js && node --check tests/c01-reader/check.mjs
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: python3 tests/c01-reader/make-books.py
      - name: Browser import TOC text speech resume
        run: node tests/c01-reader/check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c01-browser-evidence
          path: tests/c01-reader/evidence/

name: Verify public K3 Radiance daylight

on:
  push:
    paths:
      - ".github/workflows/verify-public-k3.yml"
      - "scripts/verify-public-k3.cjs"
      - "portal/k02-board.html"
      - "portal/assets/k3-radiance-daylight-v0.1.js"
      - "portal/data/k3-radiance-daylight.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-public-k3
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser verifier
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium --with-deps

      - name: Verify deployed Radiance result and main-page rendering
        env:
          PUBLIC_URL: https://foxlongfei.github.io/zero-one-workbench/portal/k02-board.html
          EVIDENCE_DIR: docs/v0.1/evidence/k3
        run: node scripts/verify-public-k3.cjs

      - name: Upload immutable public evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k3-public-radiance-evidence
          path: docs/v0.1/evidence/k3/
          if-no-files-found: error

      - name: Commit passing public evidence
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v0.1/evidence/k3/
          git commit -m "test(k3): record public Radiance evidence"
          git pull --rebase origin main
          git push origin HEAD:main

name: V0.2 A01 DeepSeek Aider comparison
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: v02-a01-deepseek-comparison
  cancel-in-progress: false
jobs:
  aider-deepseek-a01:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check API credential availability without revealing it
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::DEEPSEEK_API_KEY is missing from GitHub Actions secrets; no API call was made."
            exit 1
          fi
      - name: Install same Aider version as Qwen baseline
        run: python -m pip install 'aider-chat==0.86.1'
      - name: Prepare identical bounded A01 assignment
        run: |
          git config user.name "v02-agent[bot]"
          git config user.email "v02-agent[bot]@users.noreply.github.com"
          git switch -c "agent/a01-deepseek-${{ github.run_id }}"
          cat > /tmp/a01-task.txt <<'TASK'
          This is a narrow A01 pilot, NOT acceptance of A01. Modify ONLY portal/assets/v02-exercise-workbench.js.
          Improve the existing push-up Exercise object user experience with one concrete, functional and testable improvement:
          add a visible, accessible checklist of 3 common form errors and corresponding corrections,
          sourced as original project guidance (not a clinical diagnosis). Keep existing animation and other features.
          Keep all claims honest: 2D original diagram, not a licensed motion library or full 3D model.
          No new dependencies, no external URLs, no changing any other files.
          TASK
      - name: Aider performs bounded DeepSeek code edit
        id: edit
        env:
          OPENAI_API_BASE: https://api.deepseek.com
          OPENAI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AIDER_ANALYTICS: 'false'
          AIDER_CHECK_UPDATE: 'false'
        run: |
          timeout 150s aider --model openai/deepseek-flash --message-file /tmp/a01-task.txt \
            --yes --no-auto-commits --no-auto-test --no-auto-lint --no-stream \
            --map-tokens 0 --no-check-update --no-show-model-warnings \
            portal/assets/v02-exercise-workbench.js
      - name: Validate scope and product code
        run: |
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "portal/assets/v02-exercise-workbench.js"
          git diff --quiet && { echo "::error::No product change"; exit 1; }
          node --check portal/assets/v02-exercise-workbench.js
          node scripts/v02-verify.mjs
          git diff --check
      - name: Create draft comparison PR (never auto-merge)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add portal/assets/v02-exercise-workbench.js
          git commit -m "experiment(a01): Aider DeepSeek bounded comparison"
          git push origin "HEAD:agent/a01-deepseek-${{ github.run_id }}"
          gh pr create --draft --base main --head "agent/a01-deepseek-${{ github.run_id }}" \
            --title "A01: Aider DeepSeek comparison (not accepted)" \
            --body "Controlled comparison with Qwen A01 pilot. Same baseline workflow constraints and task; separate branch. No automatic merge. Review code, tests, provenance and runtime logs. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

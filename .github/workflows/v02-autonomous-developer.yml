name: V0.2 Q and D Prototype Developers
on:
  workflow_dispatch:
    inputs:
      project:
        description: "Choose one project or all"
        required: true
        default: all
        type: choice
        options: [all, A01, B01, C01]
  schedule:
    - cron: '37 2 * * 1,3,5'
permissions:
  contents: read
concurrency:
  group: v02-agent-${{ github.event.inputs.project || 'all' }}
  cancel-in-progress: false
jobs:
  develop:
    if: github.repository == 'foxlongfei/zero-one-workbench'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        project: [A01, B01, C01]
        provider: [Q, D]
    permissions:
      contents: read
    steps:
      - name: Select project
        id: select
        env:
          REQUESTED: ${{ github.event.inputs.project || 'all' }}
          PROJECT: ${{ matrix.project }}
        run: |
          if [[ "$REQUESTED" == "all" || "$REQUESTED" == "$PROJECT" ]]; then
            echo "selected=true" >> "$GITHUB_OUTPUT"
          else
            echo "selected=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.select.outputs.selected == 'true'
        with:
          persist-credentials: false
      - name: Check agent credential
        if: steps.select.outputs.selected == 'true'
        env:
          API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -z "$API_KEY" ]]; then
            echo "::error::Missing QWEN_API_KEY or DEEPSEEK_API_KEY GitHub Actions secret for selected provider. Chat app connections do not automatically grant GitHub Actions API credentials."
            exit 1
          fi
      - name: Prepare bounded work order
        if: steps.select.outputs.selected == 'true'
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          mkdir -p /tmp/v02-agent
          case "$PROJECT" in
            A01) issue=22; page="portal/movement-v02-experience.html"; objective="Deliver actual licensed dynamic teaching resources for at least two distinct full-body training exercises, integrated into the existing follow-along flow.";;
            B01) issue=21; page="portal/traditional-case-v02.html"; objective="Deliver an actual source-traceable intake-to-method case workflow for both lost-property and residence, preserving residence as a submodule. Never invent predictions.";;
            C01) issue=11; page="portal/read-with-you-v01.html"; objective="Deliver real reading continuation/progress and accessible voice controls while respecting text copyright and existing issues 10-15.";;
          esac
          {
            echo "You are the implementation agent for $PROJECT, issue #$issue. Work in a small bounded increment."
            echo "Read docs/v0.2/2026-10-13-integrated-prototype-rebaseline.md and the current portal source."
            echo "Goal: $objective"
            echo "Edit $page and, only as needed, related portal assets and tests/v02. Do not edit other projects, .github/workflows, secrets, permissions, or historical issue data."
            echo "Build working user-facing functionality, not just a plan or documentation. Reuse existing mature open foundations where licensing permits."
            echo "Run appropriate local tests; document exact limitations and failures. Do not claim independent blind validation, external Pages deployment or acceptance."
            echo "Keep existing features and accessible links. Do not introduce unsupported medical or predictive claims."
          } > /tmp/v02-agent/prompt.txt
      - name: Run Q or D implementation agent
        if: steps.select.outputs.selected == 'true'
        uses: QwenLM/qwen-code-action@v1
        with:
          openai_api_key: ${{ matrix.provider == 'Q' && secrets.QWEN_API_KEY || secrets.DEEPSEEK_API_KEY }}
          openai_base_url: ${{ matrix.provider == 'Q' && 'https://dashscope.aliyuncs.com/compatible-mode/v1' || 'https://api.deepseek.com/v1' }}
          openai_model: ${{ matrix.provider == 'Q' && 'qwen-coder-plus-latest' || 'deepseek-chat' }}
          prompt: |
            You are a code implementation agent. Read /tmp/v02-agent/prompt.txt.
            Actually edit the relevant source files and tests in the workspace.
            Do not just propose a plan. Do not create PRs yourself.
            Report what changed and what you could test.
      - name: Validate changes are in scope
        if: steps.select.outputs.selected == 'true'
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          python3 - "$PROJECT" <<'PY'
          import subprocess,sys
          p=sys.argv[1]
          allowed={'A01':['portal/movement-v02-experience.html','portal/assets/','tests/v02/'],
                   'B01':['portal/traditional-case-v02.html','portal/housing-v02-experience.html','portal/assets/','tests/v02/'],
                   'C01':['portal/read-with-you-v01.html','portal/assets/','tests/v02/']}[p]
          changed=subprocess.check_output(['git','status','--porcelain','--untracked-files=all'],text=True).splitlines()
          paths=[line[3:] for line in changed]
          bad=[x for x in paths if not any(x==a or (a.endswith('/') and x.startswith(a)) for a in allowed)]
          print('Changed:',paths)
          if bad:sys.exit('Out of scope modifications: '+repr(bad))
          PY
          python3 tests/v02/check_prototypes.py --project "$PROJECT"
      - name: Save patch for isolated PR publisher
        if: steps.select.outputs.selected == 'true'
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          mkdir -p /tmp/v02-patch
          git add -A
          git diff --cached --binary > "/tmp/v02-patch/$PROJECT-\${{ matrix.provider }}.patch"
          if [[ ! -s "/tmp/v02-patch/$PROJECT-\${{ matrix.provider }}.patch" ]]; then
            echo "::error::Agent produced no code changes."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: steps.select.outputs.selected == 'true'
        with:
          name: v02-agent-${{ matrix.project }}-patch
          path: /tmp/v02-patch/${{ matrix.project }}.patch
          retention-days: 14
  propose:
    needs: develop
    if: always() && needs.develop.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          pattern: v02-agent-*-patch
          path: /tmp/agent-patches
          merge-multiple: true
      - name: Open isolated PRs for review
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for project in A01 B01 C01; do
           for provider in Q D; do
            patch="/tmp/agent-patches/$project-$provider.patch"
            [[ -s "$patch" ]] || continue
            branch="agent/v02-${project,,}-$RUN_ID"
            git checkout -B "$branch" origin/main
            git apply --index "$patch"
            git commit -m "feat($project): $provider autonomous V0.2 prototype increment"
            git push origin "$branch"
            case "$project" in A01) issue=22;; B01) issue=21;; C01) issue=11;; esac
            gh pr create --base main --head "$branch" --draft --title "V0.2 $project $provider automated prototype increment" --body "Automated code proposal for #$issue. Review required. This PR is NOT deployment, independent blind testing, or accepted product. Run V0.2 validation and verify the public user journey before merging."
           done
          done

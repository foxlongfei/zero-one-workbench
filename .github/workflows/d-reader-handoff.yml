name: D博士 C01 reader execution handoff
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d-reader-handoff.yml'
permissions:
  contents: read
  issues: write
jobs:
  deepseek-handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Request D博士 implementation review and executable patch
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,pathlib,subprocess
          key=os.environ.get('DEEPSEEK_API_KEY')
          if not key: raise SystemExit('DEEPSEEK_API_KEY is not configured')
          paths=['portal/reader-integrated.html','portal/reader-integrated.js','tests/c01-reader/check.mjs']
          sources=[]
          for name in paths:
              p=pathlib.Path(name)
              if p.exists(): sources.append({'path':name,'content':p.read_text(encoding='utf8')[:26000]})
          task='''你是D博士，C01陪你读书项目的主责开发与验收者。用户已将实现工作移交给你。阅读给定现有代码，提出**可直接应用的真实 unified diff patch**，不要泛泛建议，不要删减功能。优先修复一项有证据的实际缺陷。回复严格JSON: {"summary":"...","patch":"...","tests":["..."],"risks":["..."]}。补丁必须有标准---/+++文件头、@@行号；若信息不足，patch为空并说明。你目前仅能提出补丁，不能声称已经部署或验收。'''
          data=json.dumps({'model':'deepseek-chat','messages':[{'role':'system','content':task},{'role':'user','content':json.dumps({'issue':42,'sources':sources},ensure_ascii=False)}],'max_tokens':6500,'stream':False}).encode()
          req=urllib.request.Request('https://api.deepseek.com/chat/completions',data=data,headers={'Authorization':'Bearer '+key,'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=150) as response: result=json.load(response)
          answer=result['choices'][0]['message'].get('content','')
          pathlib.Path('artifacts/d-reader').mkdir(parents=True,exist_ok=True)
          pathlib.Path('artifacts/d-reader/response.json').write_text(json.dumps({'model':result.get('model'),'answer':answer,'usage':result.get('usage',{})},ensure_ascii=False,indent=2),encoding='utf8')
          print('DeepSeek returned',len(answer),'characters; artifact saved')
          # Publish evidence to the original issue, not a completion claim.
          body='D博士API调用已返回。完整原始回答见本次GitHub Actions artifact。此步骤尚未自动应用补丁、部署或验收。\\n\\nRun: '+os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']
          subprocess.run(['gh','issue','comment','42','--body',body],check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d-reader-response
          path: artifacts/d-reader/
          retention-days: 30

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>运动达人 V0.1｜完整 3D 人体</title>
<link rel="stylesheet" href="assets/style.css">
<style>
:root{color-scheme:light}.human-app{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}.viewer{height:min(72vh,760px);min-height:560px;position:relative;overflow:hidden;border-radius:20px;background:linear-gradient(#e9efea,#dfe7e1)}#human3d{width:100%;height:100%;display:block}.hud{position:absolute;left:14px;top:14px;z-index:3;background:#fffffff0;border:1px solid #d8ded9;border-radius:12px;padding:10px 12px;font-size:13px;max-width:300px}.hud b{display:block;margin-bottom:3px}.side{background:#fff;border:1px solid #d9ddd8;border-radius:18px;padding:16px}.searchrow{display:flex;gap:7px}.searchrow input{min-width:0;flex:1;padding:10px;border:1px solid #cbd3cd;border-radius:10px}.searchrow button,.tool{padding:9px 11px;border:1px solid #cbd3cd;border-radius:10px;background:#f6f8f6;cursor:pointer}.tool.active{background:#e2eee5;border-color:#7e9887}.tools{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.result{min-height:92px;padding:12px;border-radius:12px;background:#f4f7f4;border:1px solid #e0e5e1}.small{font-size:12px;color:#66726b}.status-ok{color:#285d3c}.status-bad{color:#8a3d35}.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.legend button{padding:8px;text-align:left;border:1px solid #dde2de;background:#fff;border-radius:9px;cursor:pointer}.legend button:hover{background:#f0f5f1}@media(max-width:850px){.human-app{grid-template-columns:1fr}.viewer{height:62vh;min-height:480px}}
</style>
</head>
<body><main class="wrap">
<p><a href="index.html">← 零一空间</a></p>
<section class="card">
<p><b>T1｜完整人体整机｜EXECUTING</b></p>
<h1>运动达人 V0.1</h1>
<p>先把一个完整的人真正放到这里。拖动旋转，滚轮/双指缩放，点击人体选择，或搜索身体部位定位。旧局部 OBJ 不再作为主界面。</p>
<div class="human-app">
<div class="viewer" id="viewer"><canvas id="human3d" aria-label="可交互完整3D人体"></canvas>
<div class="hud"><b id="loadState">正在加载完整人体…</b><span id="interactionState">拖动旋转 · 滚轮缩放 · 点击选择</span></div></div>
<aside class="side">
<h2>找身体部位</h2>
<div class="searchrow"><input id="bodySearch" placeholder="例如：头、肩、手、膝、脚、躯干"><button id="searchBtn">定位</button></div>
<div class="tools"><button class="tool" id="resetView">全身</button><button class="tool" id="frontView">正面</button><button class="tool" id="backView">背面</button><button class="tool" id="playMotion">▶ 动作</button></div>
<div class="result" id="selection"><b>当前：完整人体</b><p>模型加载后可直接操作。</p></div>
<h3>快速定位</h3>
<div class="legend" id="quickParts"></div>
<p class="small">本轮 T1 只验收“完整人体整机”与基本交互，不把它冒充解剖学精细模型。训练场景属于 T2。</p>
<p class="small">人体底座：Khronos glTF Sample Assets 的 Cesium Man（CC BY 4.0）；渲染与交互：Three.js（MIT）。</p>
</aside></div>
</section>
</main>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
import {OrbitControls} from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";
import {GLTFLoader} from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";

const canvas=document.getElementById("human3d"),host=document.getElementById("viewer");
const loadState=document.getElementById("loadState"),interactionState=document.getElementById("interactionState"),selection=document.getElementById("selection");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff,0x66756c,2.4));
const key=new THREE.DirectionalLight(0xffffff,3.2);key.position.set(3,5,4);scene.add(key);
const camera=new THREE.PerspectiveCamera(38,1,.01,100);camera.position.set(1.9,1.15,3.2);
const controls=new OrbitControls(camera,canvas);controls.enableDamping=true;controls.target.set(0,1,0);controls.minDistance=.7;controls.maxDistance=8;
const ground=new THREE.Mesh(new THREE.CircleGeometry(1.35,64),new THREE.MeshStandardMaterial({color:0xd4ddd6,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.015;scene.add(ground);
let human=null,mixer=null,activeAction=null,baseBox=null;
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();
const partDefs=[
["头","head",1.58],["颈","neck",1.43],["左肩","shoulder_l",1.34],["右肩","shoulder_r",1.34],
["胸/躯干","torso",1.12],["左手","hand_l",.86],["右手","hand_r",.86],["髋","hip",.86],
["左膝","knee_l",.50],["右膝","knee_r",.50],["左脚","foot_l",.08],["右脚","foot_r",.08]
];
const aliases={"头":"head","头部":"head","颈":"neck","脖子":"neck","肩":"shoulder","肩膀":"shoulder","左肩":"shoulder_l","右肩":"shoulder_r","胸":"torso","胸部":"torso","躯干":"torso","身体":"torso","手":"hand","手掌":"hand","左手":"hand_l","右手":"hand_r","髋":"hip","胯":"hip","膝":"knee","膝盖":"knee","左膝":"knee_l","右膝":"knee_r","脚":"foot","足":"foot","左脚":"foot_l","右脚":"foot_r"};
function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
new ResizeObserver(resize).observe(host);resize();
function fitWhole(direction=1){if(!human)return;const b=new THREE.Box3().setFromObject(human),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3());const d=Math.max(s.x,s.y,s.z)*1.65;controls.target.copy(c);camera.position.set(0,c.y,d*direction);camera.position.z=d*direction;camera.position.y=c.y;camera.lookAt(c);controls.update()}
function focusY(y,label){if(!human)return;const b=new THREE.Box3().setFromObject(human),c=b.getCenter(new THREE.Vector3()),size=b.getSize(new THREE.Vector3());const target=new THREE.Vector3(c.x,b.min.y+size.y*y,c.z);controls.target.copy(target);camera.position.set(target.x+1.0,target.y+.12,target.z+1.55);controls.update();selection.innerHTML="<b>当前："+label+"</b><p>已定位到该身体区域。可继续旋转、缩放观察。</p>"}
function findPart(q){q=(q||"").trim();if(!q)return null;const id=aliases[q]||Object.entries(aliases).find(([k])=>q.includes(k))?.[1];if(!id)return null;const def=partDefs.find(x=>x[1]===id)||partDefs.find(x=>x[1].startsWith(id+"_"));return def}
document.getElementById("searchBtn").onclick=()=>{const q=document.getElementById("bodySearch").value,d=findPart(q);if(d)focusY(d[2]/1.72,d[0]);else selection.innerHTML="<b>没有定位到“"+q.replace(/[<>]/g,"") +"”</b><p>先试：头、肩、胸、手、髋、膝、脚。</p>"};
document.getElementById("bodySearch").onkeydown=e=>{if(e.key==="Enter")document.getElementById("searchBtn").click()};
const quick=document.getElementById("quickParts");["头","肩","胸/躯干","手","髋","膝","脚"].forEach(label=>{const b=document.createElement("button");b.textContent=label;b.onclick=()=>{const d=findPart(label==="胸/躯干"?"胸":label);if(d)focusY(d[2]/1.72,label)};quick.appendChild(b)});
document.getElementById("resetView").onclick=()=>fitWhole(1);
document.getElementById("frontView").onclick=()=>{fitWhole(1);interactionState.textContent="正面 · 可继续拖动"};
document.getElementById("backView").onclick=()=>{fitWhole(-1);interactionState.textContent="背面 · 可继续拖动"};
document.getElementById("playMotion").onclick=()=>{if(!activeAction)return;activeAction.reset().play();interactionState.textContent="正在播放模型自带动作";};
canvas.addEventListener("pointerup",e=>{if(!human)return;const r=canvas.getBoundingClientRect();pointer.x=((e.clientX-r.left)/r.width)*2-1;pointer.y=-((e.clientY-r.top)/r.height)*2+1;raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObject(human,true);if(hits.length){const p=hits[0].point,b=new THREE.Box3().setFromObject(human),ratio=(p.y-b.min.y)/(b.max.y-b.min.y);let d=partDefs.reduce((a,x)=>Math.abs(x[2]/1.72-ratio)<Math.abs(a[2]/1.72-ratio)?x:a,partDefs[0]);selection.innerHTML="<b>已点选："+d[0]+"</b><p>点击位置已映射到当前人体区域；T2 再把训练动作与反馈挂到这些入口。</p>";interactionState.textContent="已选择 "+d[0]}});
const clock=new THREE.Clock();
new GLTFLoader().load("https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CesiumMan/glTF-Binary/CesiumMan.glb",gltf=>{
 human=gltf.scene;scene.add(human);human.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
 baseBox=new THREE.Box3().setFromObject(human);const size=baseBox.getSize(new THREE.Vector3());human.scale.setScalar(1.72/size.y);baseBox=new THREE.Box3().setFromObject(human);const min=baseBox.min;human.position.y-=min.y;
 if(gltf.animations.length){mixer=new THREE.AnimationMixer(human);activeAction=mixer.clipAction(gltf.animations[0]);}
 loadState.textContent="完整 3D 人体已加载";loadState.className="status-ok";selection.innerHTML="<b>当前：完整人体</b><p>已可旋转、缩放、点击、搜索定位。</p>";fitWhole(1);
},undefined,err=>{console.error(err);loadState.textContent="人体加载失败";loadState.className="status-bad";selection.innerHTML="<b>加载失败</b><p>请刷新页面；当前没有用假人形替代真实模型。</p>"});
renderer.setAnimationLoop(()=>{const dt=clock.getDelta();if(mixer)mixer.update(dt);controls.update();renderer.render(scene,camera)});
</script>
</body></html>

<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>堪舆先生｜先生接案</title>
<style>body{margin:0;background:#f4f0e6;color:#273127;font:17px/1.6 system-ui}main{max-width:1050px;margin:auto;padding:20px}section{background:#fffefa;padding:20px;border-radius:18px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}@media(max-width:700px){.grid{grid-template-columns:1fr}}button,input,select,textarea{font:inherit;padding:10px;border:1px solid #9b9a8c;border-radius:9px}button{cursor:pointer}.primary{background:#3d6047;color:white}.case-type[aria-pressed="true"]{background:#3d6047;color:#fff}.muted{color:#687067}.notice{padding:12px;background:#f2ead1;border-radius:10px}.hidden{display:none}label{display:block;margin:10px 0}input,textarea,select{width:100%;box-sizing:border-box}.row{display:flex;gap:8px;flex-wrap:wrap}.tag{display:inline-block;background:#e2eadf;padding:3px 9px;border-radius:999px;margin:3px}code{overflow-wrap:anywhere}</style></head>
<body><main id="advisor-entry" data-schema="zero-one.advisor.case.v0.1" data-case-status="EMPTY">
<h1>堪舆先生 · 整体接案入口</h1>
<p>先把问题、资料、方法与边界放进同一个 Case。当前只开放“失物”和“住宅”两条可操作样板；不以界面或传统方法名称冒充预测能力。</p>
<section><h2>① 这次想问什么</h2><div class="row" id="case-types">
<button class="case-type" data-type="lost" aria-pressed="false">失物</button>
<button class="case-type" data-type="residence" aria-pressed="false">住宅</button>
<button class="case-type" data-type="fortune" aria-pressed="false">吉凶</button>
<button class="case-type" data-type="future" aria-pressed="false">前程</button>
<button class="case-type" data-type="marriage" aria-pressed="false">婚姻</button>
<button class="case-type" data-type="fertility" aria-pressed="false">求子</button>
<button class="case-type" data-type="date" aria-pressed="false">择日</button></div>
<p id="type-status" class="notice">请选择问题类型。涉及健康、生育、财产时，本原型不替代医疗、法律或警方等专业渠道。</p></section>
<section id="case-form" class="hidden"><h2>② 建立同一 Case</h2>
<p>Case ID：<code id="case-id"></code></p>
<label>称呼（可匿名）<input id="client" placeholder="如：访客"></label>
<label>问题描述<textarea id="question" rows="3" placeholder="只写希望处理的问题，不输入身份证、详细门牌等敏感信息"></textarea></label>
<div id="lost-fields" class="hidden"><label>物品名称<input id="lost-item" placeholder="如：钥匙"></label><label>最后确认地点<input id="lost-place" placeholder="如：办公室抽屉"></label><label>最后确认时间<input id="lost-time" type="datetime-local"></label></div>
<div id="residence-fields" class="hidden"><label>住宅概况<input id="residence-summary" placeholder="如：两房一厅，朝向待确认"></label><label>当前关注<input id="residence-concern" placeholder="如：采光、动线或材料归档"></label></div>
<label>选择当前可用方法<select id="method"></select></label>
<p id="method-boundary" class="muted"></p><p id="method-contract" class="notice"></p>
<button class="primary" id="save-case">保存并检查缺口</button>
<button id="export-case">导出当前 Case JSON</button>
<label>导入已有 Case JSON<input id="import-case" type="file" accept="application/json,.json"></label>
<p id="next-question" class="notice"></p></section>
<section><h2>③ 连续案例</h2><p id="case-history">尚无已保存 Case。</p><p><a id="residence-link" href="housing-v02-experience.html">住宅专题：平面图标注与观察档案 →</a> · <a href="k02-board.html">原有证据与研究工作台 →</a></p>
<p id="housing-observation-summary" class="notice">当前 Case 尚未关联住宅观察档案。</p>
<p class="muted">保存只发生在当前浏览器。任何预测准确性主张都需要另行预注册、盲测与失败记录；本入口目前不输出吉凶、方位或寻物结论。</p></section></main>
<script>
(function(){var q=function(id){return document.getElementById(id)},root=q('advisor-entry'),selected='',caseId='';var available={
lost:{label:'失物',methods:[['information-ledger','事实材料整理'],['traditional-method-placeholder','传统方法（占位，不演算）']],boundary:'当前只整理物品、最后地点与时间，并生成追问；不声称能推断位置。'},
residence:{label:'住宅',methods:[['residence-dossier','住宅材料归一化'],['housing-observation','平面图观察专题']],boundary:'当前建立住宅资料与专题入口；没有模型运行与证据时不生成传统判断。'}
};var unavailable={fortune:'吉凶',future:'前程',marriage:'婚姻',fertility:'求子',date:'择日'};
function uid(){return 'case-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8)}
function load(){try{return JSON.parse(localStorage.getItem('advisor-cases-v01')||'[]')}catch(e){return []}}
function store(items){localStorage.setItem('advisor-cases-v01',JSON.stringify(items.slice(-30)))}
function linkedObservation(id){try{var item=JSON.parse(localStorage.getItem('advisor-housing-observation:'+id)||'null');return item&&item.schema==='housing-observation-v02'&&item.advisorCaseId===id?item:null}catch(e){return null}}
function validateLinkedObservation(item){var observation=item.linkedHousingObservation;if(!observation)return '';if(observation.schema!=='housing-observation-v02')return '住宅观察 schema 不匹配';if(observation.advisorCaseId!==item.caseId)return '住宅观察未绑定当前 Case ID';if(!Array.isArray(observation.annotations))return '住宅观察标注格式无效';for(var i=0;i<observation.annotations.length;i++){var point=observation.annotations[i];if(!point||!Number.isFinite(point.x)||!Number.isFinite(point.y)||point.x<0||point.x>1||point.y<0||point.y>1||!point.type)return '住宅观察坐标或类型无效'}return ''}
function persistLinkedObservation(item){if(item.linkedHousingObservation)localStorage.setItem('advisor-housing-observation:'+item.caseId,JSON.stringify(item.linkedHousingObservation))}
function withoutLinkedObservation(item){var copy=JSON.parse(JSON.stringify(item));delete copy.linkedHousingObservation;return copy}
function renderLinkedObservation(){var box=q('housing-observation-summary'),item=caseId?linkedObservation(caseId):null;if(!item){box.textContent='当前 Case 尚未关联住宅观察档案。';root.dataset.housingObservationStatus='NOT_LINKED';root.dataset.housingAnnotationCount='0';return}var count=Array.isArray(item.annotations)?item.annotations.length:0;box.textContent='同一 Case 已关联住宅观察：'+item.name+'｜标注 '+count+' 条｜北向 '+item.north+'°｜更新时间 '+item.updated_at+'。这些是用户输入，不是自动识别或堪舆结论。';root.dataset.housingObservationStatus='LINKED_SAME_CASE';root.dataset.housingAnnotationCount=String(count)}
function exportPayload(item){var copy=JSON.parse(JSON.stringify(item)),observation=linkedObservation(item.caseId);if(observation)copy.linkedHousingObservation=observation;return copy}
var contracts={
'information-ledger':{version:'v0.1',status:'MATERIAL_ORGANIZATION_ONLY',input:'物品、最后确认地点与时间',output:'事实账本与缺失追问',evidence:'用户提供材料',boundary:'不推断物品位置，不输出吉凶。'},
'traditional-method-placeholder':{version:'v0.1',status:'NOT_IMPLEMENTED',input:'未开放',output:'无',evidence:'无可复现演算',boundary:'仅保留方法槽位，禁止生成结论。'},
'residence-dossier':{version:'v0.1',status:'MATERIAL_ORGANIZATION_ONLY',input:'住宅概况与关注点',output:'同一 Case 的住宅材料档案',evidence:'用户材料与住宅专题',boundary:'未运行模型时不输出分析结论。'},
'housing-observation':{version:'v0.1',status:'LINKED_SUBMODULE',input:'住宅平面与观察材料',output:'住宅专题入口',evidence:'housing-v02-experience.html',boundary:'专题记录不等于整个先生结论。'}
};
function updateResidenceLink(){var link=q('residence-link'),current=load().find(function(x){return x.caseId===caseId&&x.type==='residence'});if(current){link.href='housing-v02-experience.html?caseId='+encodeURIComponent(current.caseId)+'&source=advisor';link.dataset.caseId=current.caseId;link.textContent='继续同一住宅 Case：平面图标注与观察档案 →'}else{link.href='housing-v02-experience.html';delete link.dataset.caseId;link.textContent='住宅专题：平面图标注与观察档案 →'}}
function renderHistory(){var items=load(),box=q('case-history');box.textContent='';if(!items.length){box.textContent='尚无已保存 Case。'}else{box.appendChild(document.createTextNode('本机已保存 '+items.length+' 个 Case：'));items.forEach(function(x){var row=document.createElement('span');row.style.display='block';row.dataset.caseHistoryRow=x.caseId;var b=document.createElement('button');b.type='button';b.className='restore-case';b.dataset.caseId=x.caseId;b.textContent='继续先生整理｜'+x.caseId+'｜'+x.typeLabel+'｜修订 '+((x.revisions||[]).length);b.onclick=function(){restoreCase(x.caseId)};row.appendChild(b);if(x.type==='residence'){var observation=linkedObservation(x.caseId),tag=document.createElement('span');tag.className='tag';tag.dataset.caseObservationStatus=x.caseId;tag.textContent=observation?'住宅观察已关联｜标注 '+((observation.annotations||[]).length)+' 条':'住宅观察待补充';var link=document.createElement('a');link.href='housing-v02-experience.html?caseId='+encodeURIComponent(x.caseId)+'&source=advisor-history';link.dataset.openHousingCase=x.caseId;link.textContent=observation?' 查看/继续住宅观察 →':' 建立住宅观察 →';row.append(' ',tag,' ',link)}box.appendChild(row)})}root.dataset.savedCaseCount=String(items.length);updateResidenceLink()}
function renderMethodContract(){var c=contracts[q('method').value];q('method-contract').textContent=c?'方法合同 '+c.version+'｜'+c.status+'｜输入：'+c.input+'｜输出：'+c.output+'｜证据：'+c.evidence+'｜边界：'+c.boundary:'请选择方法。';root.dataset.methodStatus=c?c.status:''}
function missing(){var fields=[['client','称呼'],['question','问题描述']];if(selected==='lost')fields=fields.concat([['lost-item','物品名称'],['lost-place','最后确认地点'],['lost-time','最后确认时间']]);if(selected==='residence')fields=fields.concat([['residence-summary','住宅概况'],['residence-concern','当前关注']]);return fields.filter(function(x){return !q(x[0]).value.trim()}).map(function(x){return x[1]})}
function choose(type){document.querySelectorAll('.case-type').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.type===type))});if(!available[type]){selected='';caseId='';q('case-form').classList.add('hidden');q('type-status').textContent=unavailable[type]+'：NOT_AVAILABLE。本轮未实现资料合同、演算或验证，不能生成结论。';root.dataset.caseStatus='UNAVAILABLE_EXPLICIT';root.dataset.selectedType=type;return}selected=type;caseId=uid();root.dataset.selectedType=type;root.dataset.caseStatus='DRAFT';root.dataset.restoredCase='false';q('case-id').textContent=caseId;q('case-form').classList.remove('hidden');q('lost-fields').classList.toggle('hidden',type!=='lost');q('residence-fields').classList.toggle('hidden',type!=='residence');q('method').innerHTML='';available[type].methods.forEach(function(m){var o=document.createElement('option');o.value=m[0];o.textContent=m[1];q('method').appendChild(o)});q('method-boundary').textContent=available[type].boundary;renderMethodContract();q('type-status').textContent='已选择'+available[type].label+'。所有后续记录绑定 Case ID '+caseId+'。';q('next-question').textContent='请补充：'+missing().join('、');}
function restoreCase(id){var item=load().find(function(x){return x.caseId===id});if(!item||!available[item.type])return;choose(item.type);caseId=item.caseId;q('case-id').textContent=caseId;q('client').value=item.client||'';q('question').value=item.question||'';if(item.type==='lost'){q('lost-item').value=item.fields.item||'';q('lost-place').value=item.fields.lastPlace||'';q('lost-time').value=item.fields.lastTime||''}else{q('residence-summary').value=item.fields.summary||'';q('residence-concern').value=item.fields.concern||''}if([...q('method').options].some(function(o){return o.value===item.method}))q('method').value=item.method;renderMethodContract();root.dataset.caseStatus=item.status;root.dataset.restoredCase='true';root.dataset.revisionCount=String((item.revisions||[]).length);q('type-status').textContent='已恢复 '+item.typeLabel+' Case；所有补充继续绑定 '+caseId+'。';q('next-question').textContent='已恢复材料，可继续补充并再次保存；已有 '+((item.revisions||[]).length)+' 条可追溯修订，当前不输出预测。';updateResidenceLink();renderLinkedObservation()}
function coreSnapshot(item){return {client:item.client,question:item.question,method:item.method,status:item.status,fields:item.fields}}
function validateRevisionChain(item){var revisions=item.revisions||[];if(!Array.isArray(revisions))return '修订链格式无效';for(var i=0;i<revisions.length;i++){var r=revisions[i],previous=i?revisions[i-1]:null;if(!r||!/^revision-[a-z0-9-]+$/.test(r.revisionId||''))return '修订 ID 无效';if((r.parentRevisionId||null)!==(previous?previous.revisionId:null))return '修订父链断裂';if(r.caseId!==item.caseId||!r.after)return '修订未绑定当前 Case'}if(revisions.length&&JSON.stringify(revisions[revisions.length-1].after)!==JSON.stringify(coreSnapshot(item)))return '修订末态与 Case 不一致';return ''}
function validateImported(item){if(!item||item.schema!==root.dataset.schema)return 'schema 不匹配';if(!/^case-[a-z0-9-]+$/.test(item.caseId||''))return 'Case ID 无效';if(!available[item.type])return '问题类型未开放';if(!item.fields||typeof item.fields!=='object')return '材料字段缺失';if(!available[item.type].methods.some(function(m){return m[0]===item.method}))return '方法不属于该问题类型';var expected=contracts[item.method];if(!item.methodContract||item.methodContract.status!==expected.status||item.methodContract.boundary!==expected.boundary)return '方法合同与当前版本不一致';if(item.status!=='MATERIALS_RECORDED_NO_PREDICTION')return '状态不允许导入';return validateLinkedObservation(item)||validateRevisionChain(item)}
function revisionIds(item){return (item.revisions||[]).map(function(r){return r.revisionId})}
function isPrefix(left,right){return left.length<=right.length&&left.every(function(id,index){return right[index]===id})}
function canonicalCase(item){var copy=JSON.parse(JSON.stringify(item));return JSON.stringify(copy)}
document.querySelectorAll('.case-type').forEach(function(b){b.onclick=function(){choose(b.dataset.type)}});q('method').onchange=renderMethodContract;q('save-case').onclick=function(){var gaps=missing();if(gaps.length){q('next-question').textContent='先生下一问：请补充“'+gaps[0]+'”。仍缺：'+gaps.join('、');root.dataset.caseStatus='NEEDS_CLARIFICATION';root.dataset.missingCount=String(gaps.length);return}var methodContract=contracts[q('method').value],items=load(),previous=items.find(function(x){return x.caseId===caseId}),item={schema:root.dataset.schema,caseId:caseId,type:selected,typeLabel:available[selected].label,client:q('client').value.trim(),question:q('question').value.trim(),method:q('method').value,methodContract:methodContract,status:'MATERIALS_RECORDED_NO_PREDICTION',fields:selected==='lost'?{item:q('lost-item').value.trim(),lastPlace:q('lost-place').value.trim(),lastTime:q('lost-time').value}:{summary:q('residence-summary').value.trim(),concern:q('residence-concern').value.trim()},boundary:available[selected].boundary,savedAt:new Date().toISOString()};var revisions=previous&&Array.isArray(previous.revisions)?previous.revisions.slice():[],parent=revisions.length?revisions[revisions.length-1].revisionId:null;revisions.push({revisionId:'revision-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7),parentRevisionId:parent,caseId:caseId,changedAt:item.savedAt,before:previous?coreSnapshot(previous):null,after:coreSnapshot(item)});item.revisions=revisions;items=items.filter(function(x){return x.caseId!==caseId});items.push(item);store(items);root.dataset.caseStatus=item.status;root.dataset.missingCount='0';root.dataset.revisionCount=String(revisions.length);q('next-question').textContent='材料已保存为修订 '+revisions.length+'；当前不输出预测。Case ID 保持 '+caseId+'。';renderHistory()};
q('export-case').onclick=function(){var current=load().find(function(x){return x.caseId===caseId});if(!current){q('next-question').textContent='请先保存当前 Case，再导出。';return}var payload=exportPayload(current),blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=current.caseId+'.json';a.click();setTimeout(function(){URL.revokeObjectURL(url)},1000)};
q('import-case').onchange=function(){var file=this.files&&this.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(){try{var imported=JSON.parse(reader.result),error=validateImported(imported);if(error)throw new Error(error);var hasObservation=Boolean(imported.linkedHousingObservation),item=withoutLinkedObservation(imported),items=load(),existing=items.find(function(x){return x.caseId===item.caseId});if(existing){var localIds=revisionIds(existing),incomingIds=revisionIds(item);if(canonicalCase(existing)===canonicalCase(item)){if(hasObservation){persistLinkedObservation(imported);root.dataset.importStatus='OBSERVATION_LINKED';restoreCase(item.caseId);q('next-question').textContent='同一 Case 已存在；住宅观察档案已验证并恢复到 '+item.caseId+'。当前不输出预测。';return}root.dataset.importStatus='ALREADY_PRESENT';restoreCase(item.caseId);q('next-question').textContent='无需重复导入：同一 Case ID 与修订链已存在。';return}if(isPrefix(incomingIds,localIds)){root.dataset.importStatus='LOCAL_AHEAD';restoreCase(item.caseId);q('next-question').textContent='未覆盖：本机同一 Case 已包含更多修订。';return}if(!isPrefix(localIds,incomingIds))throw new Error('同一 Case ID 的修订链发生分叉冲突')}items=items.filter(function(x){return x.caseId!==item.caseId});items.push(item);store(items);if(hasObservation)persistLinkedObservation(imported);renderHistory();restoreCase(item.caseId);root.dataset.importStatus=hasObservation?'PASS_WITH_OBSERVATION':existing?'FAST_FORWARD':'PASS';q('next-question').textContent=(existing?'快进导入成功：':'导入成功：')+'已恢复同一 Case ID '+item.caseId+(hasObservation?' 及其住宅观察档案':'')+'，可继续补充；当前不输出预测。'}catch(error){root.dataset.importStatus='REJECTED';q('next-question').textContent='导入拒绝：'+error.message+'；现有 Case 未被覆盖。'}finally{q('import-case').value=''}};reader.readAsText(file)};
renderHistory();renderLinkedObservation();var resumeId=new URLSearchParams(location.search).get('resumeCase');if(resumeId){restoreCase(resumeId);if(caseId===resumeId){root.dataset.returnedFromHousing='true';var observation=linkedObservation(caseId);q('next-question').textContent='已从住宅标注返回同一 Case '+caseId+'；'+(observation?'观察档案已关联到本次 Case 导出。':'尚未找到同 ID 观察档案。')+'当前不输出预测。'}}})();
</script></body></html>

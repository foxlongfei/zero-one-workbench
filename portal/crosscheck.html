<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>动起来｜三博士交叉认证</title><link rel="stylesheet" href="assets/style.css"><style>.case{margin:18px 0}.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.col{padding:14px;border:1px solid #ddd;border-radius:12px;background:#fff}.pending{border-style:dashed}.open{background:#fff8df}.badge{font-size:12px;background:#eee;padding:3px 7px;border-radius:10px}.row{display:flex;gap:8px;flex-wrap:wrap}.row span{border:1px solid #ccc;border-radius:12px;padding:6px 9px}@media(max-width:720px){.cols{grid-template-columns:1fr}}</style><body><div class="bar"><b>动起来｜三博士交叉认证</b><span>不是投票，是回到同一段证据</span><button onclick="location.href='movement.html'">研究现场</button></div><main class="wrap"><h1 class="hero">同一段动作，三个人分别看，再把分歧钉到具体证据。</h1><p class="muted">当前C博士首轮已存在；Q/D任务已准备但结果未回收，所以空栏保持空栏。结果回来后直接填入，不改历史。</p><div id="app"></div></main><script>
fetch('movement-crosscheck.json').then(r=>r.json()).then(d=>{app.innerHTML=d.cases.map(x=>`<section class="card case"><h2>${x.id}｜${x.action}</h2><div class="cols"><div class="col"><span class="badge">C博士 · 已有首轮</span><h3>现在看到什么</h3>${x.c.findings.map(f=>'<p>✓ '+f+'</p>').join('')}<p><b>次数：</b>${x.c.result}</p></div><div class="col pending"><span class="badge">Q博士 · 待独立结果</span><h3>这里将出现</h3><p>动作区间、候选周期、视角优缺点、看不清的位置。</p><p><b>不会：</b>先看C答案再补一个相似答案。</p></div><div class="col pending"><span class="badge">D博士 · 待独立结果</span><h3>这里将出现</h3><p>误算、漏算、重复算、规则过拟合和反例。</p><p><b>不会：</b>为了凑一致而消掉冲突。</p></div></div><div class="open col"><b>OPEN｜下一步要钉死的问题</b><div class="row">${x.open.map(o=>'<span>? '+o+'</span>').join('')}</div></div></section>`).join('')})
</script></body></html>

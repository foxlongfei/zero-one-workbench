<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>堪舆先生 V0</title><style>body{margin:0;font-family:system-ui;background:#f2efe7;color:#26241f}.app{max-width:900px;margin:auto;padding:24px}.chat{background:#fff;border:1px solid #d8d0c0;border-radius:20px;padding:20px}.msg{padding:14px;border-radius:14px;margin:10px 0;background:#f4f0e7}.me{background:#e7ece5;margin-left:15%}textarea{width:100%;min-height:90px;border:1px solid #c9c0af;border-radius:12px;padding:12px;box-sizing:border-box;font-size:16px}button{padding:10px 14px;border:1px solid #807866;border-radius:999px;background:#353a31;color:white;margin:5px;cursor:pointer}.quick button{background:#f7f4ed;color:#333}.tool{margin-top:16px;background:#eae5d9;border-radius:14px;padding:14px}details{margin-top:16px}</style></head><body><main class="app"><h1>堪舆先生</h1><p>直接说现实中的事情。方法、方位、历法和资料应该由后台处理，而不是让你先选项目编号。</p><section class="chat"><div class="msg">你可以直接问，例如：“我准备搬家，想看看这个地方。” 我会先问真正缺少的信息，再决定使用什么工具。</div><div class="quick"><button onclick="fill('我准备搬家，想看看这个地方。')">看看一个地方</button><button onclick="fill('我想看看房屋的朝向。')">看看朝向</button><button onclick="fill('我想了解一个时间问题。')">看看时间</button></div><textarea id="q" placeholder="直接输入你的问题"></textarea><div><button onclick="ask()">发送</button><button onclick="voice()">🎙 语音输入</button><button onclick="speak()">🔊 朗读</button></div><div id="out" class="msg">等待你的问题。</div><div class="tool" id="tool" hidden><b>下一步需要的信息</b><div id="need"></div></div></section><details><summary>方法、来源与边界</summary><p>这是重新建立的产品入口。旧 Z05、二十四山、历法与其他实验成果只作为后台候选工具；只有在问题确实需要、来源与规则满足要求时才调用。历史方法的存在不等于现代有效性。</p></details></main><script>function fill(x){q.value=x}let last='';function ask(){let s=q.value.trim();if(!s)return;let n='';if(/搬家|地方|房|住宅/.test(s))n='请先给我地点（地址、地图位置或周边描述），如果讨论具体住宅，再补充大门/主要采光面的方向或现场照片。';else if(/朝向|方向|方位/.test(s))n='请给出测得的方向角度，并说明是真北还是磁北；不知道也可以，我会告诉你怎么取得。';else if(/时间|日期|日子/.test(s))n='请给出具体日期、时间、地点，以及你真正想判断的问题。';else n='我先确认：你想解决的现实问题是什么？涉及地点、时间、人物还是具体行动？';last='我先不替你选流派或方法。\n\n'+n;out.innerText=last;need.innerText=n;tool.hidden=false}function voice(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){alert('当前浏览器不支持网页语音识别');return}let x=new R();x.lang='zh-CN';x.onresult=e=>q.value=e.results[0][0].transcript;x.start()}function speak(){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(out.innerText))}</script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; script-src 'self'; style-src 'self' 'unsafe-inline' blob:; img-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'none'"><title>陪你读书｜书架</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans SC",sans-serif;color:#292e29;background:#f3f0e9}*{box-sizing:border-box}body{margin:0}main{max-width:1060px;margin:auto;padding:18px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:clamp(25px,4vw,38px);margin:18px 0}button,select,input{font:inherit}button{border:1px solid #d3d3c9;background:white;border-radius:10px;padding:10px 14px;cursor:pointer}button:hover{background:#eef1e9}a{color:#245942}section{background:#fff;border:1px solid #e1ded5;border-radius:16px;padding:18px;margin:15px 0}.muted{color:#66706b;font-size:14px}#shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:15px}.book{min-height:205px;background:#e7e3d7;border:1px solid #d1cbbb;border-radius:12px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;padding:17px;overflow-wrap:anywhere}.book strong{font-size:18px}.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.toolbar button{padding:8px 11px}#readerScreen[hidden],#shelfScreen[hidden],#tocPanel[hidden],#settings[hidden]{display:none}#bookView{height:min(73vh,790px);min-height:430px;border-radius:12px;overflow:hidden;background:#fff}foliate-view{display:block;width:100%;height:100%}#textView{font:20px/1.85 Georgia,"Noto Serif SC",serif;overflow:auto;height:100%;padding:24px;white-space:pre-wrap}#tocPanel{max-height:50vh;overflow:auto}#tocList{list-style:none;padding:0}#tocList button{display:block;width:100%;text-align:left;margin:4px 0}#status{min-height:1.5em;color:#245942}#settings{background:#f5f5f0}#settings label{display:inline-block;margin:7px}#settings audio{width:100%}@media(max-width:600px){main{padding:10px}section{padding:12px}#bookView{height:73vh}}
</style></head><body><main><header><a href="index.html">← 零一空间</a><span>陪你读书</span></header>
<section id="shelfScreen"><h1>我的书架</h1><p class="muted">选一本书，进入正文。书籍仅保存在本机浏览器；原有书库可直接使用。</p><label><button id="importButton" type="button">＋ 添加电子书</button><input id="files" type="file" accept=".epub,.mobi,.azw3,.fb2,.cbz,.txt" multiple hidden></label><p class="muted">已接入 foliate-js：EPUB / MOBI / AZW3 / FB2 / CBZ；TXT 使用本地纯文本阅读。加密书籍不支持；PDF 尚未接入。</p><div id="shelf"></div></section>
<section id="readerScreen" hidden><div class="toolbar"><button id="back">← 书架</button><strong id="bookTitle"></strong><button id="tocButton">☰ 目录</button><button id="speak" aria-label="朗读或暂停">🔊 朗读</button><button id="settingsButton">⚙ 选项</button></div><div id="tocPanel" hidden><h3>目录</h3><ul id="tocList"></ul></div><div id="settings" hidden><label>声音 <select id="voice"></select></label><label>速度 <select id="rate"><option value=".8">0.8×</option><option value="1" selected>1×</option><option value="1.2">1.2×</option><option value="1.5">1.5×</option></select></label><p class="muted">使用设备现有声音；个性化声音训练尚未接入。</p><label>背景音乐（本机音频）<input type="file" id="musicFile" accept="audio/*"></label><audio id="music" controls loop></audio><label>背景音量 <input id="volume" type="range" min="0" max="0.5" step=".05" value=".15"></label></div><div id="bookView"><div id="textView" hidden></div></div><div class="toolbar"><button id="prev">← 上一页</button><button id="next">下一页 →</button><span id="position" class="muted"></span></div></section><p id="status" role="status" aria-live="polite"></p><p class="muted">阅读内核：foliate-js（MIT），zip.js（BSD-3-Clause），fflate（MIT）。当前为待验收集成版，尚未通过公开设备及整书朗读测试。</p></main><script type="module" src="reader-integrated.js"></script></body></html>

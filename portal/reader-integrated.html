<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>陪你读书｜整书阅读器</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#26372f;background:#f6f4ed}body{margin:0}main{max-width:1050px;margin:auto;padding:20px}header,.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}header{justify-content:space-between}button,input,select{font:inherit;padding:9px;border:1px solid #b8c6bb;border-radius:8px;background:white}button{cursor:pointer}button:disabled{opacity:.5}a{color:#165d43}.panel,.book{background:white;border:1px solid #d9e0d8;border-radius:12px;padding:15px;margin:12px 0}.book{display:grid;gap:8px}.book .toolbar{margin-top:4px}#shelf{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}#status{padding:12px;background:#e7f0e8;border-radius:8px}#bookView{min-height:58vh}foliate-view{display:block;height:65vh}#textView{white-space:pre-wrap;line-height:1.95;font-size:19px;max-width:70ch;margin:auto;padding:20px;min-height:45vh}#tocPanel{max-height:45vh;overflow:auto}#tocList{padding-left:20px}#tocList button{text-align:left;width:100%}[hidden]{display:none!important}#music{max-width:100%}

/* C01 book-first design: visual library and distraction-free reading */
:root{--ink:#27332d;--muted:#68746c;--accent:#486b55;--paper:#faf8f2;--line:#e7e4dc}
body{background:var(--paper);color:var(--ink)}main{max-width:1220px;padding:clamp(16px,3vw,42px)}header{padding:8px 0 20px;border-bottom:1px solid var(--line)}header h1{font-family:Georgia,"Noto Serif SC",serif;font-size:clamp(30px,4vw,44px);font-weight:500;letter-spacing:.03em;margin:8px 0}header a{font-size:14px}
.panel{background:transparent;border:0;border-radius:0;padding:12px 0;box-shadow:none}
#shelfScreen>h2{font-size:21px;font-weight:550;margin:20px 0}#shelfScreen>.toolbar{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 16px;justify-content:space-between}#shelfScreen input[type=search]{min-width:190px;background:#fafaf7;border:0}
#shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:30px 22px;margin:32px 0}
.book{display:flex;flex-direction:column;gap:12px;border:0;background:transparent;padding:0;margin:0;min-width:0}
.book-cover{position:relative;aspect-ratio:3/4.1;border-radius:4px 10px 10px 4px;display:flex;flex-direction:column;justify-content:space-between;padding:22px 17px;color:#f9f4e9;background:linear-gradient(125deg,rgba(255,255,255,.16),transparent 28%),linear-gradient(145deg,#486354,#243e38);box-shadow:inset 5px 0 8px rgba(0,0,0,.2),4px 8px 18px rgba(40,55,43,.17);overflow:hidden;transition:transform .18s ease}
.book:nth-child(5n+2) .book-cover{background:linear-gradient(125deg,rgba(255,255,255,.14),transparent 28%),linear-gradient(145deg,#8c654f,#4e3433)}
.book:nth-child(5n+3) .book-cover{background:linear-gradient(125deg,rgba(255,255,255,.14),transparent 28%),linear-gradient(145deg,#67788c,#35465c)}
.book:nth-child(5n+4) .book-cover{background:linear-gradient(125deg,rgba(255,255,255,.14),transparent 28%),linear-gradient(145deg,#8c8159,#575b3e)}
.book:nth-child(5n+5) .book-cover{background:linear-gradient(125deg,rgba(255,255,255,.14),transparent 28%),linear-gradient(145deg,#7d6479,#4a374c)}
.book-cover::after{content:"";position:absolute;inset:12px;border:1px solid rgba(255,255,255,.3);pointer-events:none}
.book-cover>span{font-family:Georgia,"Noto Serif SC",serif;font-size:clamp(17px,1.7vw,23px);line-height:1.45;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.book-cover small{font-size:12px;letter-spacing:.18em;color:#eee7da}.book:hover .book-cover{transform:translateY(-5px)}
.book-cover.has-image{padding:0;background:#e8e4da}.book-cover.has-image::after{inset:0;border-color:rgba(0,0,0,.1);border-radius:inherit}.book-cover.has-image img{display:block;width:100%;height:100%;object-fit:cover}
.book-details{display:grid;gap:5px}.book-details strong{font-size:15px;line-height:1.45;overflow-wrap:anywhere}.book-details small{color:var(--muted);font-size:12px}.book-details .toolbar{gap:6px}.book-details button{font-size:12px;padding:6px 8px}
button{background:#fff;border:1px solid #d5ded5}button:hover{border-color:var(--accent)}#importButton,#speak{background:var(--accent);color:#fff;border-color:var(--accent)}
#readerScreen{max-width:1100px;margin:auto}#readerScreen>.toolbar:first-child{position:sticky;top:0;z-index:10;background:rgba(250,248,242,.96);backdrop-filter:blur(10px);padding:12px 0;border-bottom:1px solid var(--line)}
#bookTitle{font-family:Georgia,"Noto Serif SC",serif;font-size:19px;flex:1}#bookView{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:18px 0;min-height:55vh}foliate-view{height:67vh}
#textView{background:#fff;border:1px solid var(--line);border-radius:14px;padding:clamp(20px,5vw,56px);margin:18px auto;font-family:Georgia,"Noto Serif SC",serif;font-size:19px;line-height:2.1;max-width:76ch}
#readerScreen>.toolbar:last-child{justify-content:center;position:sticky;bottom:0;background:rgba(250,248,242,.96);backdrop-filter:blur(10px);padding:12px 4px;border-top:1px solid var(--line)}
#position{font-size:13px;color:var(--muted);min-width:120px;text-align:center}#settings,#tocPanel,#bookmarkPanel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}#bookmarkList{padding-left:20px}#bookmarkList li{margin:.55rem 0}#bookmarkList button{margin-right:.45rem}
@media(max-width:600px){#shelf{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 14px}.book-cover{padding:18px 12px}.book-details .toolbar{flex-wrap:wrap}#shelfScreen>.toolbar{align-items:stretch}#readerScreen>.toolbar:first-child{gap:7px}#bookView{padding:4px}foliate-view{height:65vh}}
</style></head><body><main>
<header><div><a href="index.html">← 零一空间</a><h1>陪你读书</h1></div><a href="reading-library.html">旧版书库目录</a></header>
<p id="status" role="status" aria-live="polite">正在载入本机书库……</p>
<section id="shelfScreen" class="panel"><h2>我的书架 <small style="font-size:13px;color:#718076;font-weight:400">· 封面书架 / 本机藏书</small></h2><div class="toolbar"><button id="importButton" disabled>正在初始化……</button><input id="files" type="file" accept=".epub,.mobi,.azw3,.fb2,.cbz,.txt" multiple hidden><label>搜索书籍 <input id="shelfSearch" type="search" placeholder="书名或文件名"></label><span id="searchSummary"></span></div><div id="shelf"></div><p>双击书籍封面或点击「阅读」进入整书阅读。书籍只保存在当前浏览器中，请保留原文件。</p></section>
<section id="readerScreen" class="panel" hidden><div class="toolbar"><button id="back">← 返回书架</button><strong id="bookTitle"></strong><button id="tocButton" disabled>目录</button><button id="bookmarkButton">书签</button><button id="bookmarkAdd">＋ 添加书签</button><button id="settingsButton">朗读设置</button></div>
<div id="tocPanel" class="panel" hidden><h3>目录</h3><ol id="tocList"></ol></div>
<div id="bookmarkPanel" class="panel" hidden><h3>本书书签</h3><ol id="bookmarkList"></ol><p id="bookmarkEmpty">还没有书签。</p></div>
<div id="settings" class="panel" hidden><label>声音 <select id="voice"></select></label> <label>语速 <input id="rate" type="range" min=".6" max="1.8" step=".1" value="1"></label><p><label>背景音（本机文件） <input id="musicFile" type="file" accept="audio/*"></label> <label>音量 <input id="volume" type="range" min="0" max="1" step=".05" value=".15"></label></p><p><label><input id="ducking" type="checkbox" checked> 朗读时自动压低背景音</label> <small>暂停或朗读结束后恢复原音量</small></p><audio id="music" controls loop></audio></div>
<div id="bookView"></div><div id="textView" hidden></div>
<div class="toolbar"><button id="prev">上一页</button><span id="position"></span><button id="next">下一页</button><button id="speak">🔊 朗读</button></div></section>
</main><script type="module" src="reader-integrated.js"></script></body></html>

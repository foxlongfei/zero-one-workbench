<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>陪你读书｜整书阅读器</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#26372f;background:#f6f4ed}body{margin:0}main{max-width:1050px;margin:auto;padding:20px}header,.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}header{justify-content:space-between}button,input,select{font:inherit;padding:9px;border:1px solid #b8c6bb;border-radius:8px;background:white}button{cursor:pointer}button:disabled{opacity:.5}a{color:#165d43}.panel,.book{background:white;border:1px solid #d9e0d8;border-radius:12px;padding:15px;margin:12px 0}.book{display:grid;gap:8px}.book .toolbar{margin-top:4px}#shelf{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}#status{padding:12px;background:#e7f0e8;border-radius:8px}#bookView{min-height:58vh}foliate-view{display:block;height:65vh}#textView{white-space:pre-wrap;line-height:1.95;font-size:19px;max-width:70ch;margin:auto;padding:20px;min-height:45vh}#tocPanel{max-height:45vh;overflow:auto}#tocList{padding-left:20px}#tocList button{text-align:left;width:100%}[hidden]{display:none!important}#music{max-width:100%}
</style></head><body><main>
<header><div><a href="index.html">← 零一空间</a><h1>陪你读书</h1></div><a href="reading-library.html">旧版书库目录</a></header>
<p id="status" role="status" aria-live="polite">正在载入本机书库……</p>
<section id="shelfScreen" class="panel"><h2>我的书架</h2><div class="toolbar"><button id="importButton" disabled>正在初始化……</button><input id="files" type="file" accept=".epub,.mobi,.azw3,.fb2,.cbz,.txt" multiple hidden><label>搜索书籍 <input id="shelfSearch" type="search" placeholder="书名或文件名"></label><span id="searchSummary"></span></div><div id="shelf"></div><p>书籍保存在当前浏览器本机，不上传服务器。请保留原文件。</p></section>
<section id="readerScreen" class="panel" hidden><div class="toolbar"><button id="back">← 返回书架</button><strong id="bookTitle"></strong><button id="tocButton" disabled>目录</button><button id="settingsButton">朗读设置</button></div>
<div id="tocPanel" class="panel" hidden><h3>目录</h3><ol id="tocList"></ol></div>
<div id="settings" class="panel" hidden><label>声音 <select id="voice"></select></label> <label>语速 <input id="rate" type="range" min=".6" max="1.8" step=".1" value="1"></label><p><label>背景音（本机文件） <input id="musicFile" type="file" accept="audio/*"></label> <label>音量 <input id="volume" type="range" min="0" max="1" step=".05" value=".15"></label></p><audio id="music" controls loop></audio></div>
<div id="bookView"></div><div id="textView" hidden></div>
<div class="toolbar"><button id="prev">上一页</button><span id="position"></span><button id="next">下一页</button><button id="speak">🔊 朗读</button></div></section>
</main><script type="module" src="reader-integrated.js"></script></body></html>

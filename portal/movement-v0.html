<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>运动达人 V0</title><style>body{margin:0;font-family:system-ui;background:#101310;color:#eef2ed}.app{max-width:1100px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#181d19;border:1px solid #303a32;border-radius:18px;padding:18px}h1{margin:0 0 8px}.body{height:420px;display:grid;place-items:center;background:radial-gradient(circle,#273129,#121612);border-radius:14px}.person{font-size:220px;line-height:1;user-select:none;transition:.2s}.chips button,button{background:#273329;color:#fff;border:1px solid #465548;border-radius:999px;padding:10px 14px;margin:4px;cursor:pointer}textarea{width:100%;min-height:90px;background:#0f1310;color:#fff;border:1px solid #3c473e;border-radius:12px;padding:12px;box-sizing:border-box}.reply{margin-top:12px;padding:14px;background:#101410;border-radius:12px;min-height:90px}@media(max-width:760px){.grid{grid-template-columns:1fr}.body{height:320px}.person{font-size:170px}}</style></head><body><main class="app"><h1>运动达人</h1><p>先告诉我你今天想做什么。人体与训练工具在同一处，不需要理解项目编号。</p><div class="grid"><section class="card"><h2>身体</h2><div class="body"><div id="p" class="person">🧍</div></div><div class="chips"><button onclick="pick('肩颈')">肩颈</button><button onclick="pick('腰背')">腰背</button><button onclick="pick('腿')">腿</button><button onclick="pick('全身')">全身</button><button onclick="turn()">转动人体</button></div><p id="part">当前：完整身体</p></section><section class="card"><h2>今天想练什么？</h2><textarea id="q" placeholder="例如：我只有20分钟，在家，想练全身；或者我做深蹲时膝盖不舒服。"></textarea><div><button onclick="ask()">开始</button><button onclick="voice()">🎙 语音输入</button><button onclick="speak()">🔊 朗读回答</button></div><div id="r" class="reply">我会先根据目标、时间、环境和身体反馈组织下一步。这里是新 V0 的可操作入口；真实模型聊天将复用 ZERO-CORE 已交付接口继续接入。</div></section></div><details class="card" style="margin-top:18px"><summary>来源与边界</summary><p>这是新产品壳的第一版，不继承旧右上肢实验台。完整可点击解剖人体、动作演示与视频分析将接成熟开放底座；未接通能力不伪装成已完成。</p></details></main><script>let rot=0,last='';function pick(x){document.getElementById('part').textContent='当前关注：'+x;document.getElementById('q').value='我今天想练'+x+'，';}function turn(){rot+=45;document.getElementById('p').style.transform='rotateY('+rot+'deg)'}function ask(){let q=document.getElementById('q').value.trim();last=q?'收到：“'+q+'”\n\n下一步我需要把这句话交给真实运动达人能力，而不是用固定文本假装回答。当前 V0 已完成新的操作入口，模型与完整人体底座继续接入。':'先告诉我目标、时间、环境或身体感觉。';document.getElementById('r').innerText=last}function voice(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){alert('当前浏览器不支持网页语音识别');return}let x=new R();x.lang='zh-CN';x.onresult=e=>document.getElementById('q').value=e.results[0][0].transcript;x.start()}function speak(){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(document.getElementById('r').innerText))}</script></body></html>

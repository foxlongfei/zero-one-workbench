<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A01 MediaPipe 姿态识别</title><h1>A01 全身姿态识别</h1><p>调用成熟 MediaPipe Pose Landmarker 模型，非自制模型；视频只在本机分析。</p><button id="start">启动摄像头</button><button id="stop">停止</button><p id="status">未启动</p><div style="position:relative;max-width:700px"><video id="video" autoplay muted playsinline style="width:100%"></video><canvas id="canvas" style="position:absolute;inset:0;width:100%;height:100%"></canvas></div><p>动作：<select id="exercise"><option>俯卧撑</option><option>深蹲</option></select> 次数：<input id="reps" type="number" value="5" min="0"><button id="save">保存训练</button></p><p id="history"></p><p>上游：MediaPipe（Apache-2.0），模型：pose_landmarker_lite；需联网、HTTPS、摄像头权限。</p><script type="module">
import {PoseLandmarker,FilesetResolver,DrawingUtils} from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm';
const g=id=>document.getElementById(id),v=g('video'),c=g('canvas'),ctx=c.getContext('2d');let model,stream,run=false,frame=0,last=-1;
async function start(){try{g('status').textContent='加载模型…';const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm');model=await PoseLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task'},runningMode:'VIDEO',numPoses:1});stream=await navigator.mediaDevices.getUserMedia({video:true});v.srcObject=stream;await v.play();run=true;loop()}catch(e){g('status').textContent='启动失败：'+e.message;stop()}}
function loop(){if(!run)return;if(v.readyState>=2&&v.currentTime!==last){last=v.currentTime;c.width=v.videoWidth;c.height=v.videoHeight;const r=model.detectForVideo(v,performance.now()),d=new DrawingUtils(ctx);for(const p of r.landmarks){d.drawConnectors(p,PoseLandmarker.POSE_CONNECTIONS,{color:'#00b99d'});d.drawLandmarks(p,{color:'#f90',radius:3})}g('status').textContent='检测人体：'+r.landmarks.length}frame=requestAnimationFrame(loop)}
function stop(){run=false;cancelAnimationFrame(frame);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;v.srcObject=null;ctx.clearRect(0,0,c.width,c.height)}
g('start').onclick=start;g('stop').onclick=stop;g('save').onclick=()=>{const a=JSON.parse(localStorage.getItem('a01-records')||'[]');a.push({date:new Date().toISOString(),exercise:g('exercise').value,reps:Number(g('reps').value)});localStorage.setItem('a01-records',JSON.stringify(a.slice(-30)));g('history').textContent='已保存 '+a.length+' 次'};window.addEventListener('pagehide',stop);
</script>

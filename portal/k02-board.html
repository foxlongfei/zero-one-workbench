<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>堪舆先生 V0.1</title>
<style>body{margin:0;background:#f4f1e9;color:#20251f;font:16px/1.65 system-ui,-apple-system,"Noto Sans SC",sans-serif}main{max-width:980px;margin:auto;padding:22px}.card{background:#fffdf8;border:1px solid #d7d0c2;border-radius:18px;padding:20px;margin:14px 0}.wish{font-size:20px;width:100%;box-sizing:border-box;min-height:110px;padding:14px;border:1px solid #bfc7c0;border-radius:14px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}button,.file{font:inherit;padding:9px 12px;border:1px solid #bfc7c0;border-radius:10px;background:#fff;cursor:pointer}.primary{background:#e3ece4}.material{display:flex;gap:8px;flex-wrap:wrap}.preview{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin-top:10px}.preview figure{margin:0;border:1px solid #ddd5c8;border-radius:12px;padding:8px}.preview img,.preview video{width:100%;max-height:180px;object-fit:cover;border-radius:8px}.reply{background:#f5f2e9;border-radius:14px;padding:16px;min-height:110px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:13px;background:#f1eee5;border-radius:99px;padding:5px 9px}.muted{color:#6d716b}.field{display:grid;grid-template-columns:140px 1fr;gap:8px;align-items:center;margin:8px 0}.field input{padding:9px;border:1px solid #c7c1b7;border-radius:9px}@media(max-width:620px){.field{grid-template-columns:1fr}}</style></head>
<body><main><p><a href="index.html">← 零一空间</a></p>
<section class="card"><p><b>堪舆先生 V0.1</b></p><h1>我想……</h1>
<textarea class="wish" id="wish" placeholder="直接说现实问题。例如：我准备重新布置这套房，想看看卧室、门和主要活动区怎么处理。"></textarea>
<div class="actions"><button class="primary" id="ask">问先生</button><button data-demo="我想看看这套房的布局和朝向，需要我提供什么？">看住宅</button><button data-demo="我有出生信息，想结合现在住的房子一起看。">生辰＋住宅</button></div>
<div class="material"><label class="file">＋ 图片/照片 <input id="images" type="file" accept="image/*" multiple hidden></label><label class="file">＋ 视频 <input id="videos" type="file" accept="video/*" multiple hidden></label></div>
<div id="preview" class="preview"></div><p class="muted">可以先发户型图、房间照片、罗盘/方向截图、现场视频；不要求你先整理成工程参数。</p></section>
<section class="card"><h2>先生</h2><div class="reply" id="reply"><b>先把问题给我。</b><p>我会先判断已有材料，再只问真正缺的东西；传统方法、计算和来源放到后台。</p></div></section>
<section class="card" id="needed" hidden><h2>还需要这些</h2><div id="fields"></div><button class="primary" id="continue">继续</button></section>
<details class="card"><summary><b>方法、计算与来源</b></summary><p>这里保留旧工程能力作为后台工具：方位归一化、二十四山、历法/干支、历史材料与来源核验。传统解释与现代可验证事实分层，不用工程编号要求用户操作。</p><div id="trace" class="muted">尚未运行具体方法。</div></details>
</main>
<script>
const wish=document.getElementById("wish"),reply=document.getElementById("reply"),needed=document.getElementById("needed"),fields=document.getElementById("fields"),preview=document.getElementById("preview");
let attachments=[];
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function addFiles(input,kind){for(const f of input.files){attachments.push({name:f.name,type:f.type,kind});const fig=document.createElement("figure"),url=URL.createObjectURL(f);fig.innerHTML=(kind==="image"?'<img src="'+url+'" alt="">':'<video src="'+url+'" controls></video>')+"<figcaption>"+esc(f.name)+"</figcaption>";preview.appendChild(fig)}}
document.getElementById("images").onchange=e=>addFiles(e.target,"image");document.getElementById("videos").onchange=e=>addFiles(e.target,"video");
document.querySelectorAll("[data-demo]").forEach(b=>b.onclick=()=>{wish.value=b.dataset.demo;route()});
function route(){
 const q=wish.value.trim();if(!q){reply.innerHTML="<b>你想解决什么？</b><p>一句话、照片或视频都可以作为开始。</p>";return}
 const house=/房|住宅|户型|卧室|门|朝向|风水|布局|宅/.test(q),birth=/出生|生辰|八字|命/.test(q);
 let asks=[];
 if(house){asks.push(["place","地点","城市/地区即可"],["orientation","朝向","知道度数最好；不知道可说明门窗/指南针情况"])}
 if(house&&!attachments.some(a=>a.kind==="image"))asks.push(["plan","户型/现场","可上传户型图或主要房间照片"]);
 if(birth)asks.push(["birth","出生信息","日期、时间、出生地点；不知道精确时间可直说"]);
 needed.hidden=asks.length===0;fields.innerHTML=asks.map(a=>'<div class="field"><label for="'+a[0]+'">'+a[1]+'</label><input id="'+a[0]+'" placeholder="'+a[2]+'"></div>').join("");
 const material=attachments.length?("我已看到你附了 "+attachments.length+" 个材料（"+attachments.map(a=>a.kind==="image"?"图片/照片":"视频").join("、")+"）。"):"目前没有附件。";
 if(house||birth)reply.innerHTML="<b>可以，从你的现实问题开始。</b><p>"+material+"</p><p>"+(asks.length?"我现在只补齐下面这些关键输入；拿到后再选择适合的方法，不先套结论。":"现有信息足够进入下一步整理。")+"</p>";
 else reply.innerHTML="<b>我先确认你要判断的对象。</b><p>你说的是“"+esc(q)+"”。请再告诉我是住宅/空间、生辰与时间、择日，还是其他具体问题；也可以直接附照片或视频。</p>";
}
document.getElementById("ask").onclick=route;
document.getElementById("continue").onclick=()=>{
 const vals=[...fields.querySelectorAll("input")].map(x=>[x.previousElementSibling?.textContent||x.id,x.value.trim()]).filter(x=>x[1]);
 reply.innerHTML="<b>材料已进入本次问题。</b><p>"+(vals.length?vals.map(x=>esc(x[0])+"："+esc(x[1])).join("<br>"):"补充项尚未填写。")+"</p><p><b>下一层：</b>把现实输入标准化后，再调用方位/历法/传统方法，并把依据、分歧和不确定性一起给出。不会只给一个“吉/凶”。</p>";
 document.getElementById("trace").textContent="现实输入已收集；具体模型/历法/GIS/图像理解能力待真实 provider 接入后运行。";
};
</script></body></html>

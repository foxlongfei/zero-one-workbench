<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>运动达人｜上传动作直接识别</title><style>body{font-family:system-ui;margin:0;background:#f4f6f3;color:#182019}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:white;border:1px solid #dfe5dc;border-radius:18px;padding:20px;margin:14px 0}.hero{font-size:32px;margin:0 0 8px}.muted{color:#667166}.upload{display:inline-block;padding:12px 18px;border-radius:12px;background:#183b2b;color:#fff;cursor:pointer}.stage{position:relative;display:none;margin-top:18px}.stage img{display:block;max-width:100%;border-radius:14px}.stage canvas{position:absolute;inset:0;width:100%;height:100%}.result{font-size:18px;line-height:1.7}.pill{display:inline-block;background:#edf3ee;padding:5px 10px;border-radius:999px;margin:4px}input{display:none}</style></head><body><div class="wrap"><h1 class="hero">运动达人</h1><p>给我一张动作照片，我直接识别人和关节，画回照片，并给你关节角度反馈。</p><div class="card"><label class="upload">选择动作照片<input id="file" type="file" accept="image/*"></label><div id="status" class="muted">正在准备识别能力…</div><div id="stage" class="stage"><img id="img"><canvas id="canvas"></canvas></div></div><div class="card"><div id="result" class="result">上传照片后，这里直接出结果。</div></div><p class="muted">第一版先做可检验的照片姿态识别；结果用于运动观察，不替代医疗诊断。</p></div><script type="module">import{PoseLandmarker,FilesetResolver,DrawingUtils}from'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/+esm';const status=document.querySelector('#status'),file=document.querySelector('#file'),img=document.querySelector('#img'),canvas=document.querySelector('#canvas'),stage=document.querySelector('#stage'),result=document.querySelector('#result');let pose;function angle(a,b,c){const u=[a.x-b.x,a.y-b.y],v=[c.x-b.x,c.y-b.y];const d=u[0]*v[0]+u[1]*v[1],m=Math.hypot(...u)*Math.hypot(...v);return Math.round(Math.acos(Math.max(-1,Math.min(1,d/m)))*180/Math.PI)}function joint(l,a,b,c){return angle(l[a],l[b],l[c])}async function init(){try{const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/wasm');pose=await PoseLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task',delegate:'GPU'},runningMode:'IMAGE',numPoses:1,minPoseDetectionConfidence:.5,minPosePresenceConfidence:.5});status.textContent='已就绪：请选择一张动作照片。'}catch(e){status.textContent='模型加载失败：'+e.message}}file.onchange=()=>{const f=file.files[0];if(!f)return;img.src=URL.createObjectURL(f);img.onload=async()=>{stage.style.display='block';status.textContent='正在识别…';canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;try{const r=pose.detect(img);const l=r.landmarks?.[0];const ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);if(!l){result.textContent='这张照片里没有稳定识别到完整人体。换一张身体更完整、遮挡更少的照片。';status.textContent='识别完成：未找到稳定人体。';return}const d=new DrawingUtils(ctx);d.drawConnectors(l,PoseLandmarker.POSE_CONNECTIONS,{color:'#35e06f',lineWidth:5});d.drawLandmarks(l,{color:'#ffdf4d',radius:4});const vals={左肘:joint(l,11,13,15),右肘:joint(l,12,14,16),左膝:joint(l,23,25,27),右膝:joint(l,24,26,28),左髋:joint(l,11,23,25),右髋:joint(l,12,24,26)};result.innerHTML='<b>识别到 1 个人。</b><br>'+Object.entries(vals).map(([k,v])=>`<span class="pill">${k} ${v}°</span>`).join('')+'<br><span class="muted">角度来自这张照片的二维姿态关键点；换照片可直接复测。</span>';status.textContent='识别完成。'}catch(e){status.textContent='识别失败：'+e.message}}};init();</script></body></html>

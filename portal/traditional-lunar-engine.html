<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B01｜成熟历法引擎实接</title><link rel="stylesheet" href="assets/style.css"></head><body><main class="wrap"><h1>B01｜可复算历法引擎</h1><p><a href="index.html">← 返回统一入口</a></p><p>完整保留上游 lunar-javascript 引擎，以下只是首个真实调用界面，并非全部功能或完整案例验收。</p><section class="card"><label>公历日期 <input id="date" type="date"></label> <label>时辰小时（0–23） <input id="hour" type="number" min="0" max="23" value="12"></label> <button id="calculate" type="button">实际计算</button><p id="status" role="status"></p><pre id="result" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre></section><section class="card"><h2>案例执行与追问</h2><label>案例类型 <select id="caseType"><option value="lost">失物</option><option value="home">住宅</option></select></label><label>问题与已知事实 <textarea id="caseQuestion" rows="3" placeholder="失物最后见到的时间地点、已查找位置；或住宅朝向与现场条件"></textarea></label><button id="runCase" type="button">计算并生成案例记录</button><pre id="caseOutput" style="white-space:pre-wrap"></pre><button id="saveCase" type="button">保存案例到本机</button></section><section class="card"><h2>计算来源与限制</h2><p>引擎：6tail/lunar-javascript（MIT）；本仓库保存完整上游浏览器版本及许可证，不依赖第三方在线计算 API。传统宜忌、方位、命理标签属于传统文化规则，不代表科学预测或现实决策依据。</p><p><a href="https://github.com/6tail/lunar-javascript">上游源代码</a> · <a href="vendor/lunar-javascript/LICENSE">许可证</a></p></section></main><script src="vendor/lunar-javascript/lunar.js"></script><script>
(function(){'use strict';const $=id=>document.getElementById(id);const now=new Date();$('date').value=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');
function calc(){try{if(typeof Solar==='undefined')throw Error('本地历法引擎未加载');const parts=$('date').value.split('-').map(Number),h=Number($('hour').value);if(parts.length!==3||parts.some(x=>!Number.isInteger(x))||!Number.isInteger(h)||h<0||h>23)throw Error('请输入有效日期和小时');const [y,m,d]=parts;const solar=Solar.fromYmdHms(y,m,d,h,0,0);if(solar.getYear()!==y||solar.getMonth()!==m||solar.getDay()!==d)throw Error('日期无效');const lunar=solar.getLunar();const safe=(f)=>{try{return f()}catch(e){return '此版本不支持：'+e.message}};const out={
'公历':solar.toFullString(),'农历':lunar.toFullString(),'年干支':lunar.getYearInGanZhi(),'月干支':lunar.getMonthInGanZhi(),'日干支':lunar.getDayInGanZhi(),'时干支':lunar.getTimeInGanZhi(),
'生肖':lunar.getYearShengXiao(),'节气':safe(()=>lunar.getJieQi()),'八字':safe(()=>lunar.getEightChar().toString()),'纳音':safe(()=>[lunar.getYearNaYin(),lunar.getMonthNaYin(),lunar.getDayNaYin(),lunar.getTimeNaYin()]),
'值日星宿':safe(()=>lunar.getXiu()),'十二建除':safe(()=>lunar.getZhiXing()),'宜':safe(()=>lunar.getDayYi()),'忌':safe(()=>lunar.getDayJi()),'冲煞':safe(()=>lunar.getDayChongDesc()+'；'+lunar.getDaySha()),'喜神方位':safe(()=>lunar.getDayPositionXiDesc()),'财神方位':safe(()=>lunar.getDayPositionCaiDesc())};$('result').textContent=JSON.stringify(out,null,2);$('status').textContent='已调用本地完整开源历法引擎；可修改输入复算。';}catch(e){$('status').textContent='计算失败：'+e.message;$('result').textContent='';}}
$('calculate').addEventListener('click',calc);$('runCase').onclick=()=>{calc();const kind=$('caseType').value;const missing=kind==='lost'?'请补充：最后见到物品的时间、位置、已经搜索过的地方。':'请补充：住宅实测朝向、户型、采光通风和现场环境。';const item={kind,date:$('date').value,hour:Number($('hour').value),question:$('caseQuestion').value,calculation:$('result').textContent,followUp:missing,limits:'历法可复算；失物位置与住宅吉凶不能据此可靠预测。'};$('caseOutput').textContent=JSON.stringify(item,null,2);};$('saveCase').onclick=()=>{if(!$('caseOutput').textContent){$('runCase').click()}try{const a=JSON.parse(localStorage.getItem('b01-lunar-cases')||'[]');a.push(JSON.parse($('caseOutput').textContent));localStorage.setItem('b01-lunar-cases',JSON.stringify(a.slice(-30)));$('status').textContent='案例及计算结果已保存到本机。';}catch(e){$('status').textContent='保存失败：'+e.message}};calc();})();
</script></body></html>

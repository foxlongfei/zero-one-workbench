<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>堪舆先生｜给图先看图</title><style>body{font-family:system-ui;margin:0;background:#f5f2ea;color:#27231d}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #ded7c8;border-radius:18px;padding:20px;margin:14px 0}.hero{font-size:32px;margin:0 0 8px}.muted{color:#716b60}.upload{display:inline-block;padding:12px 18px;border-radius:12px;background:#3d3528;color:#fff;cursor:pointer}.stage{position:relative;display:none;margin-top:18px}.stage img{display:block;max-width:100%;border-radius:12px}.stage .box{position:absolute;border:3px solid #e34d36;box-sizing:border-box}.stage .box span{position:absolute;left:-3px;top:-25px;background:#e34d36;color:#fff;padding:2px 6px;font-size:12px}.row{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#eee8dc;border-radius:999px;padding:6px 10px}input{display:none}</style></head><body><div class="wrap"><h1 class="hero">堪舆先生</h1><p>先给我一张户型图或房屋照片。我先真正看图，告诉你识别到了什么；不先假装会判断吉凶。</p><div class="card"><label class="upload">选择图片<input id="file" type="file" accept="image/*"></label><div id="status" class="muted">正在准备看图能力…</div><div id="stage" class="stage"><img id="img"></div></div><div class="card"><div id="result">上传图片后，这里直接反馈识别结果。</div></div><p class="muted">当前是“给图→机器视觉识别→反馈”的第一条可检验链。户型墙体/门窗专门解析与后续空间分析仍需继续增强。</p></div><script type="module">import{pipeline,env}from'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1';env.allowLocalModels=false;const file=document.querySelector('#file'),img=document.querySelector('#img'),stage=document.querySelector('#stage'),status=document.querySelector('#status'),result=document.querySelector('#result');let detector;async function init(){try{detector=await pipeline('object-detection','Xenova/detr-resnet-50',{dtype:'q8'});status.textContent='已就绪：请选择户型图或房屋照片。'}catch(e){status.textContent='识别模型加载失败：'+e.message}}file.onchange=()=>{const f=file.files[0];if(!f)return;img.src=URL.createObjectURL(f);img.onload=async()=>{stage.style.display='block';[...stage.querySelectorAll('.box')].forEach(x=>x.remove());status.textContent='正在看图…';try{const out=await detector(img.src,{threshold:.35});for(const o of out){const b=o.box,el=document.createElement('div');el.className='box';el.style.left=b.xmin/img.naturalWidth*100+'%';el.style.top=b.ymin/img.naturalHeight*100+'%';el.style.width=(b.xmax-b.xmin)/img.naturalWidth*100+'%';el.style.height=(b.ymax-b.ymin)/img.naturalHeight*100+'%';el.innerHTML='<span>'+o.label+' '+Math.round(o.score*100)+'%</span>';stage.appendChild(el)}if(out.length){result.innerHTML='<b>我在图中识别到：</b><div class="row">'+out.map(o=>`<span class="pill">${o.label} ${Math.round(o.score*100)}%</span>`).join('')+'</div><p>红框已经画回原图。你可以马上换另一张图检验。若是纯线稿户型图而没有识别出房间/门窗，我会明确显示识别不足，不把它冒充空间分析。</p>'}else result.innerHTML='<b>这张图没有识别到当前通用视觉模型能可靠命名的对象。</b><p>如果这是户型线稿，这正说明下一层需要专门的户型解析，而不是编一个分析结果给你。</p>';status.textContent='看图完成。'}catch(e){status.textContent='识别失败：'+e.message}}};init();</script></body></html>

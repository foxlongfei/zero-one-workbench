<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>每天读世界</title><style>body{font:17px/1.8 system-ui;margin:0;background:#f7f6f2;color:#252525}main{max-width:760px;margin:auto;padding:24px}input,button{font:inherit;padding:10px;margin:5px 0;border:1px solid #aaa;border-radius:7px}input{box-sizing:border-box;width:100%}button{cursor:pointer;background:#303b35;color:white}article{white-space:pre-wrap;line-height:1.95}nav button{display:block;width:100%;text-align:left;background:transparent;color:inherit;border:0;border-bottom:1px solid #ddd}small{color:#777}#msg,#loginmsg{color:#8b3b24}body.dark{background:#161a18;color:#e7e8e2}body.dark nav button{color:#eee}</style></head><body><main><h1>每天读世界</h1><small>私人全文阅读库 · 原文优先 · 来源可追溯</small><p><button id="dark">夜间模式</button></p><section id="login"><label>私人访问密钥<input id="key" type="password" autocomplete="off" spellcheck="false"></label><button id="enter">进入阅读库</button><p id="loginmsg"></p></section><section id="app" hidden><input id="url" type="url" placeholder="粘贴以 https:// 开头的文章网址"><button id="add">采集全文</button><p id="msg"></p><nav id="list"></nav><section id="reader"></section></section></main><script>
let key=sessionStorage.getItem('reader-key')||'';const el=id=>document.getElementById(id);
async function api(action,opts={}){if(!/^[A-Za-z0-9_-]{20,128}$/.test(key))throw Error('密钥格式错误');const r=await fetch('/api/reader?action='+action,{...opts,headers:{'x-reader-key':key,'content-type':'application/json'}});let raw=await r.text();let j;try{j=JSON.parse(raw)}catch{throw Error('服务器异常 HTTP '+r.status)}if(!r.ok)throw Error(j.error||'HTTP '+r.status);return j}
async function login(){key=el('key').value.trim();try{await api('health');sessionStorage.setItem('reader-key',key);el('login').hidden=true;el('app').hidden=false;await refresh()}catch(e){el('loginmsg').textContent=e.message}}
async function refresh(){let j=await api('list');el('list').replaceChildren(...j.articles.map(a=>{let b=document.createElement('button');b.textContent=a.title+' · '+a.publisher;b.onclick=()=>openArticle(a.id);return b}))}
async function add(){let b=el('add');b.disabled=true;el('msg').textContent='正在采集…';try{let url=el('url').value.trim();if(!/^https?:\/\//i.test(url))throw Error('请输入完整的 https:// 文章网址');let a=await api('import',{method:'POST',body:JSON.stringify({url})});el('msg').textContent='已采集 '+a.characters+' 字符，完整性待核对';await refresh();await openArticle(a.id)}catch(e){el('msg').textContent=e.message}finally{b.disabled=false}}
async function openArticle(id){try{let a=await api('article&id='+encodeURIComponent(id));let e=el('reader');e.replaceChildren();let h=document.createElement('h2');h.textContent=a.title;let p=document.createElement('p');p.textContent=a.author+' · '+a.publisher+' · 完整性未核验';let l=document.createElement('a');l.href=a.url;l.target='_blank';l.rel='noopener noreferrer';l.textContent='查看原文来源';let t=document.createElement('article');t.textContent=a.original;e.append(h,p,l,t)}catch(e){el('msg').textContent=e.message}}
el('dark').onclick=()=>document.body.classList.toggle('dark');el('enter').onclick=login;el('add').onclick=add;if(key){el('key').value=key;login()}
</script></body></html>

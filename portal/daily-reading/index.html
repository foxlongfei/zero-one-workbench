<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>每天读世界 · 私人阅读</title><style>
:root{--bg:#f5f2eb;--fg:#272a24;--muted:#777970;--card:#fffefa;--line:#dcdcd3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"PingFang SC",sans-serif}body.dark{--bg:#1d231e;--fg:#e9ebdf;--muted:#a6ada2;--card:#252d27;--line:#455046}header{padding:18px 5%;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}button{cursor:pointer;color:inherit;background:transparent;border:1px solid var(--line);border-radius:20px;padding:8px 13px}main{max-width:1120px;margin:auto;padding:45px 24px}small,.tag{color:var(--muted);letter-spacing:1px}h1{font:normal clamp(42px,7vw,80px) Georgia,"Songti SC",serif;margin:12px 0}p.sub{font:17px/1.8 Georgia,"Songti SC",serif;color:var(--muted);margin-bottom:40px}.grid{display:grid;grid-template-columns:290px 1fr;gap:42px;border-top:1px solid var(--line);padding-top:32px}.entry{display:block;text-align:left;width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:18px 0}.entry strong{display:block;font:21px/1.45 Georgia,"Songti SC",serif;margin:8px 0}.entry.selected{color:#73836c}article{background:var(--card);border:1px solid var(--line);padding:clamp(24px,5vw,58px)}article h2{font:normal clamp(31px,4vw,49px)/1.35 Georgia,"Songti SC",serif;margin:18px 0}#english{font:italic 18px Georgia,serif;color:var(--muted)}#by{font-size:13px;color:var(--muted);margin:20px 0}.tools{display:flex;gap:8px;flex-wrap:wrap;border-block:1px solid var(--line);padding:15px 0;margin:25px 0}.body{font:var(--size,19px)/2 Georgia,"Songti SC",serif}.body p{margin-bottom:1.4em}.hint{font:14px/1.9 system-ui,sans-serif;background:var(--bg);padding:18px;border-left:3px solid #83937c}a{color:#647c58;text-underline-offset:4px}.foot{color:var(--muted);font-size:12px;line-height:1.8;margin-top:30px}@media(max-width:720px){main{padding:30px 16px}.grid{display:block}nav{display:flex;gap:10px;overflow-x:auto;margin-bottom:25px}nav .entry{min-width:210px;border:1px solid var(--line);border-radius:9px;padding:13px}article{padding:25px 20px}}@media print{header,nav,.tools{display:none}.grid{display:block}article{border:0}}</style></head><body><header><span>DAILY WORLD READER · PRIVATE EDITION</span><button id="theme">◐ 夜间</button></header><main><small>第 001 期 · 原型阅读版</small><h1>每天读世界</h1><p class="sub">每天一篇完整的思想。今天读旧文，也是在认识今天的世界。</p><div class="grid"><nav id="nav"></nav><article><small id="tag"></small><h2 id="title"></h2><div id="english"></div><div id="by"></div><div class="tools"><button id="smaller">A−</button><button id="larger">A+</button><button id="bookmark">☆ 收藏</button><button id="mail">✉ 邮件</button><button onclick="print()">打印 / PDF</button></div><div class="body" id="body"></div><p><a id="source" target="_blank" rel="noopener">前往原站阅读全文 ↗</a></p><p class="foot">原型当前提供原创导读和原站全文链接，不冒充全文翻译。私人翻译和每日自动采集尚未启用；版权受限的全文不发布到公开 GitHub Pages。</p></article></div></main><script>
const items=[
['政治与英语','Politics and the English Language','George Orwell','The Orwell Foundation','政治 / 语言 · 1946','https://www.orwellfoundation.com/the-orwell-foundation/orwell/essays-and-other-works/politics-and-the-english-language/','政治语言如何通过套话、含混与抽象词汇遮蔽事实？奥威尔把语言习惯与思想习惯联系起来，提醒读者警惕表达中看似自然的偷换。','这篇文章的哪些判断仍适用于今天？哪些需要反驳？'],
['那些你不能说的话',"What You Can't Say",'Paul Graham','个人作者网站','社会 / 独立思考 · 2004','https://www.paulgraham.com/say.html','作者试图辨认一个时代看不见的禁忌：今天的共识，未来可能怎样评价？文章值得质疑和讨论，不代表作者的所有判断成立。','反常识与正确之间，究竟相隔多少证据？'],
['世界很糟糕，世界已经好得多，世界还可以更好','The World Is Awful. The World Is Much Better. The World Can Be Much Better.','Max Roser','Our World in Data','世界 / 数据 · 2018/2024','https://ourworldindata.org/much-better-awful-can-be-better','用长期数据同时看见苦难、进步与改变空间。文章提醒我们，不应让悲观或乐观的单一叙事覆盖复杂现实。','不同指标与不同人群会改变我们对世界的判断吗？'],
['科学革命','Scientific Revolutions','Stanford Encyclopedia of Philosophy contributors','Stanford Encyclopedia of Philosophy','科学 / 哲学','https://plato.stanford.edu/archives/fall2020/entries/scientific-revolutions/','学术综述：科学是知识逐渐累积，还是也会发生概念与研究框架的断裂？这是一张争论地图，而不是单一作者的最终答案。','如何判断科学理论的变化是修补还是革命？'],
['随笔的时代','The Age of the Essay','Paul Graham','个人作者网站','写作 / 思想 · 2004','https://www.paulgraham.com/essay.html','写作不仅是表达已知观点，也可能是寻找未知问题的工具。文章将随笔理解为一种开放式探索过程。','写作作为探索，如何避免无边界地漂移？']];
let current=0,sz=+(localStorage.getItem('reader-size')||19);const el=id=>document.getElementById(id);
function show(){let a=items[current];el('nav').innerHTML=items.map((x,i)=>'<button class="entry '+(i===current?'selected':'')+'" data-i="'+i+'"><small>0'+(i+1)+' / '+x[4]+'</small><strong>'+x[0]+'</strong><small>'+x[2]+'</small></button>').join('');document.querySelectorAll('.entry').forEach(x=>x.onclick=()=>{current=+x.dataset.i;show()});el('tag').textContent=a[4];el('title').textContent=a[0];el('english').textContent=a[1];el('by').textContent=a[2]+' · '+a[3];el('body').replaceChildren();let p=document.createElement('p');p.textContent=a[6];el('body').append(p);let n=document.createElement('div');n.className='hint';n.textContent='阅读问题：'+a[7];el('body').append(n);el('source').href=a[5];el('bookmark').textContent=localStorage.getItem('saved-'+current)==='1'?'★ 已收藏':'☆ 收藏';document.documentElement.style.setProperty('--size',sz+'px')}
el('theme').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('theme',document.body.classList.contains('dark')?'dark':'light')};if(localStorage.getItem('theme')==='dark')document.body.classList.add('dark');el('larger').onclick=()=>{sz=Math.min(26,sz+1);localStorage.setItem('reader-size',sz);show()};el('smaller').onclick=()=>{sz=Math.max(15,sz-1);localStorage.setItem('reader-size',sz);show()};el('bookmark').onclick=()=>{localStorage.setItem('saved-'+current,localStorage.getItem('saved-'+current)==='1'?'0':'1');show()};el('mail').onclick=()=>{let a=items[current];location.href='mailto:?subject='+encodeURIComponent('每天读世界｜'+a[0])+'&body='+encodeURIComponent(a[0]+'\n'+a[2]+'\n'+a[5])};show();
</script></body></html>

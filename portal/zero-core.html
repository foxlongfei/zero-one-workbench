<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>ZERO-CORE｜对话工作台</title><link rel="stylesheet" href="assets/style.css">
<style>
.chatbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.chatbar button.active{font-weight:700;outline:2px solid currentColor}.bubble{max-width:88%;padding:9px 12px;margin:8px 0;border:1px solid #ddd;border-radius:12px;white-space:pre-wrap}.bubble.me{margin-left:auto}.bubble .name{font-size:.82rem;opacity:.65;margin-bottom:4px}.composer{display:flex;gap:8px;align-items:flex-end}.composer textarea{flex:1;resize:vertical}.topline{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.statusdot{font-size:.9rem}.hidden{display:none}
</style><body><main class="wrap">
<div class="topline"><div><h1 class="hero">ZERO-CORE｜对话工作台</h1><p class="muted">模型是研究成员；项目认知属于 ZERO-CORE。</p></div><button id="logout">退出登录</button></div>
<section class="card" id="auth"><h2>安全登录</h2><label>Owner 访问码</label><input id="owner" type="password" autocomplete="current-password" style="width:100%" placeholder="仅用于换取临时会话，不保存"><p><button id="enter">登录</button> <span id="loginState" class="muted">未登录</span></p></section>
<section class="card"><div class="topline"><div><b>项目：</b><select id="space"><option>零一空间研究</option><option>动起来</option><option>公共工作台</option></select></div><span id="health" class="statusdot muted">检查服务…</span></div>
<div class="chatbar" style="margin-top:12px"><b>交流：</b><button class="who active" data-provider="c" data-label="C博士">C博士</button><button class="who" data-provider="q" data-label="Q博士">Q博士</button><button class="who" data-provider="d" data-label="D博士">D博士</button><button class="who" data-provider="all" data-label="三博士会谈">三博士会谈</button></div>
<p class="muted" id="modeHelp">当前：你 ↔ C博士，一对一。</p>
<div id="history" style="min-height:320px;max-height:58vh;overflow:auto;border:1px solid #ddd;padding:12px;border-radius:12px"><p class="muted">Enter 发送；Shift+Enter 换行。当前线程最近对话会从 D1 提供给博士作为上下文。</p></div>
<div class="composer" style="margin-top:12px"><button id="mic" title="语音输入">🎙</button><textarea id="msg" rows="3" placeholder="输入消息…"></textarea><button id="send">发送</button></div>
<div class="chatbar" style="margin-top:8px"><label><input id="read" type="checkbox"> 朗读回答</label><button id="stopRead">停止朗读</button><button id="backup">导出本页记录</button><span id="state" class="muted">请先登录。</span></div>
</section>
<section class="card"><details><summary>当前认知边界</summary><p>博士会获得项目核心工作规则与本线程最近对话，但不会把所有聊天自动写成核心知识。新的经验只能先成为“候选认知”，经过来源、实践和验证后再晋升。</p></details><p><a href="index.html">← 总入口</a> · <a href="status-current.md">任务看板</a></p></section>
</main><script>
const API='https://zero-one-workbench.longfox.workers.dev',$=id=>document.getElementById(id);let provider='c',label='C博士',rows=[];
function add(actor,text,me=false){const d=document.createElement('div');d.className='bubble'+(me?' me':'');const n=document.createElement('div');n.className='name';n.textContent=actor;const t=document.createElement('div');t.textContent=text;d.append(n,t);$('history').appendChild(d);$('history').scrollTop=$('history').scrollHeight;rows.push({time:new Date().toISOString(),actor,text})}
async function health(){try{const r=await fetch(API+'/api/health');const j=await r.json();$('health').textContent=j.ok?'● 后端在线 · D1正常':'● 后端异常'}catch(e){$('health').textContent='● 后端不可达'}}health();
function setAuth(ok){$('auth').classList.toggle('hidden',ok);$('logout').disabled=!ok;$('state').textContent=ok?'已登录，可以交流。':'请先登录。'}
$('enter').onclick=async()=>{const secret=$('owner').value;if(!secret)return $('loginState').textContent='请输入访问码';$('loginState').textContent='认证中…';try{const r=await fetch(API+'/api/session',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({owner_token:secret})});const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);sessionStorage.setItem('zeroCoreSession',j.session_token);$('owner').value='';setAuth(true)}catch(e){$('loginState').textContent='认证失败：'+e.message}};
$('logout').onclick=()=>{sessionStorage.removeItem('zeroCoreSession');sessionStorage.removeItem('zeroCoreThread');speechSynthesis?.cancel();setAuth(false);$('auth').classList.remove('hidden');$('loginState').textContent='已退出'};
document.querySelectorAll('.who').forEach(b=>b.onclick=()=>{document.querySelectorAll('.who').forEach(x=>x.classList.remove('active'));b.classList.add('active');provider=b.dataset.provider;label=b.dataset.label;$('modeHelp').textContent=provider==='all'?'当前：你 + C/Q/D 三博士会谈；未配置的博士会明确显示调用失败。':'当前：你 ↔ '+label+'，一对一。'});
async function send(){const v=$('msg').value.trim(),token=sessionStorage.getItem('zeroCoreSession');if(!v)return;if(!token)return $('state').textContent='请先登录。';add('你',v,true);$('msg').value='';$('state').textContent='正在连接 '+label+'…';try{const payload={provider,project:$('space').value,thread_id:sessionStorage.getItem('zeroCoreThread')||null,message:v};const r=await fetch(API+'/api/chat',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+token},body:JSON.stringify(payload)});const j=await r.json();if(!r.ok)throw new Error(j.error||('HTTP '+r.status));if(j.thread_id)sessionStorage.setItem('zeroCoreThread',j.thread_id);for(const x of (j.responses||[])){const txt=x.error?'调用失败：'+x.error:x.text;add(x.actor,txt);if(!x.error&&$('read').checked&&'speechSynthesis'in window){const u=new SpeechSynthesisUtterance(txt);u.lang='zh-CN';speechSynthesis.speak(u)}}$('state').textContent='完成 · thread '+(j.thread_id||'')}catch(e){$('state').textContent='发送失败：'+e.message}}
$('send').onclick=send;$('msg').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
$('stopRead').onclick=()=>{'speechSynthesis'in window&&speechSynthesis.cancel()};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){const rec=new SR();rec.lang='zh-CN';rec.interimResults=false;rec.onresult=e=>{$('msg').value=(e.results[0][0].transcript||'').trim()};rec.onerror=e=>$('state').textContent='语音输入失败：'+e.error;$('mic').onclick=()=>{rec.start();$('state').textContent='正在听…'}}else{$('mic').disabled=true;$('mic').title='当前浏览器不支持语音识别'}
$('backup').onclick=()=>{const blob=new Blob([JSON.stringify({schema:'zero-core-conversation-v0.5',project:$('space').value,provider,thread_id:sessionStorage.getItem('zeroCoreThread'),messages:rows},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='zero-core-conversation.json';a.click();URL.revokeObjectURL(a.href)};
setAuth(!!sessionStorage.getItem('zeroCoreSession'));
</script></body></html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f3">
  <title>听世界 · 世界读本</title>
  <style>
    :root{color-scheme:light;--ink:#172a27;--muted:#5e706b;--line:#d6dfda;--paper:#f6f7f3;--green:#145b4c;--orange:#a34628;--orange-soft:#f8e9df;--blue:#285a73;font-family:"Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;color:var(--ink);background:var(--paper)}
    *{box-sizing:border-box}body{margin:0}a{color:var(--blue);text-underline-offset:3px}a:hover{color:var(--orange)}header,main,footer{max-width:980px;margin:auto;padding:20px}header{padding-top:30px;border-bottom:1px solid var(--line)}.eyebrow{font:700 12px/1.4 system-ui,sans-serif;color:var(--green)}h1{font-size:42px;line-height:1.15;margin:12px 0 8px}h2{font-size:22px;margin:0 0 12px}.edition{font:600 13px/1.4 system-ui,sans-serif;color:var(--muted)}main{padding-top:24px}.status{padding:18px 0 22px;border-bottom:1px solid var(--line)}.badge{display:inline-block;padding:5px 9px;border-radius:4px;background:var(--orange-soft);color:#77361e;font:700 12px/1.4 system-ui,sans-serif}.status p,.empty{color:var(--muted);line-height:1.65}.section{padding:22px 0;border-bottom:1px solid var(--line)}.issue{display:grid;grid-template-columns:1fr auto;gap:14px;padding:14px 0;border-top:1px solid var(--line)}.issue h3{margin:0 0 5px;font-size:18px}.issue p{margin:0;color:var(--muted);font:13px/1.5 system-ui,sans-serif}.downloads{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font:600 14px/1.5 system-ui,sans-serif}footer{font:12px/1.65 system-ui,sans-serif;color:var(--muted)}@media(max-width:600px){header,main,footer{padding-left:16px;padding-right:16px}h1{font-size:32px}.issue{grid-template-columns:1fr}.downloads{padding-bottom:4px}}
  </style>
</head>
<body>
  <header>
    <div class="eyebrow">零一空间 / 听世界</div>
    <h1>世界读本</h1>
    <div class="edition">中文深度阅读 · 期刊与历史归档</div>
    <p><a href="../index.html">返回零一空间</a></p>
  </header>
  <main>
    <section class="status" aria-live="polite">
      <span class="badge" id="status-label">正在读取期刊目录</span>
      <p id="status-message">公开目录只包含完成来源与版权核验、获准公开传播的期刊。</p>
    </section>
    <section class="section" aria-labelledby="latest-title">
      <h2 id="latest-title">最新一期</h2>
      <div id="latest"><p class="empty">尚无已批准并公开发布的期刊。</p></div>
    </section>
    <section class="section" aria-labelledby="archive-title">
      <h2 id="archive-title">历史归档</h2>
      <div id="archive"><p class="empty">暂无历史刊物。</p></div>
    </section>
  </main>
  <footer><p>刊物仅在来源、中文内容许可及图片使用权核验通过后发布。完整编辑资料和出版记录由项目档案系统保存；本公开目录不承载未发布材料。</p></footer>
  <script src="./reader.js" defer></script>
</body>
</html>
